:root{
  --bg:#F4F1EA; --surface:#FBFAF6; --surface-2:#EFEBE2; --ink:#211F1C; --muted:#6B655C; --line:#DFD8CB;
  --accent:#A8452F; --accent-ink:#FFFFFF; --accent-soft:#F1E0D8; --rom:#7B5E45;
  --ok:#3A7551; --ok-soft:#E1EEE5; --bad:#B03A3A; --bad-soft:#F5E0E0;
  --shadow:0 1px 0 rgba(0,0,0,.03), 0 10px 26px -16px rgba(60,40,20,.28);
  --r:14px;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161513; --surface:#201E1B; --surface-2:#292620; --ink:#EDE8DF; --muted:#A59D90; --line:#37332C;
    --accent:#E38168; --accent-ink:#1A1310; --accent-soft:#3A2822; --rom:#D6B790;
    --ok:#7CC496; --ok-soft:#1F2F25; --bad:#E58787; --bad-soft:#3A2323; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Cabecera ---------- */
.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-top:14px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand p{font-size:12.5px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 11px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:84px}
.tab b{font-weight:500;color:inherit}
.tab small{font-size:11.5px;letter-spacing:.06em;opacity:.8}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] b{font-weight:700}

/* ---------- Secciones ---------- */
main.wrap{padding-top:26px;padding-bottom:90px}
.panel[hidden],.subpanel[hidden]{display:none}
.subtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;margin-bottom:18px}
.sec-head h2{font-size:26px;font-weight:700;letter-spacing:-.01em}
.sec-head h2 .ko-s{font-weight:300;color:var(--muted);font-size:20px;margin-left:6px}
.lede{color:var(--muted);font-size:14.5px;max-width:52ch;margin-top:4px}
.prog{min-width:200px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.guide summary{cursor:pointer;padding:12px 16px;font-size:14.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:20px;color:var(--muted);line-height:1}
.guide[open] summary::after{content:"–"}
.guide-body{padding:2px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;font-size:14px}
.guide-body h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:10px 0 6px;grid-column:span 1}
.guide-body .full{grid-column:1/-1;color:var(--muted);font-size:13.5px;margin-top:6px}
.g-row{display:grid;grid-template-columns:78px 62px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.g-row .h{font-weight:500}
.g-row .r{color:var(--rom);font-weight:500}
.g-row .d{color:var(--muted);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline;transition:border-color .15s,background .15s}
.chip small{color:var(--muted);font-size:12px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.tools input,.tools select,.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px;min-height:42px}
.tools input{flex:1 1 240px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* ---------- Tarjetas de vocabulario ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .15s}
.card.is-learned{border-color:var(--ok)}
.card-top{display:flex;justify-content:space-between;margin:-4px -6px 0}
.icon{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.on{color:var(--accent)}
.icon.on svg{fill:currentColor}
.ko{font-size:32px;font-weight:500;line-height:1.25;letter-spacing:.01em;word-break:keep-all}
.rom{color:var(--rom);font-size:15.5px;font-weight:500;letter-spacing:.01em;margin-top:2px;transition:filter .2s}
.rom-off .rom:not(.shown):not(.always){filter:blur(6px);cursor:pointer;user-select:none}
.rom-off .rom-static{display:none}
.es{margin-top:6px;font-size:15px}
.note{margin-top:8px;font-size:12.8px;color:var(--muted);line-height:1.45}
.learn{margin-top:auto;align-self:flex-start;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--muted);transition:all .15s}
.card > :nth-last-child(2){margin-bottom:12px}
.learn:hover{border-color:var(--ok);color:var(--ok)}
.learn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:500}

/* ---------- Frases ---------- */
.plist{display:grid;gap:10px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 14px 18px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;box-shadow:var(--shadow)}
.prow .ko{font-size:23px}
.prow .es{margin-top:4px}
.pact{display:flex;flex:none}

/* ---------- Diálogos ---------- */
.scene{background:var(--surface-2);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:14.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center}
.scene p{flex:1 1 280px}
.scene .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.you{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin:0 6px 3px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:12px 16px;position:relative;display:flex;gap:6px;align-items:flex-start}
.msg.you .bubble{background:var(--accent-soft);border-color:transparent;border-radius:18px 6px 18px 18px}
.bubble .ko{font-size:21px}
.bubble .es{font-size:14px;color:var(--muted)}
.bubble .icon{margin:-6px -8px -6px 0;flex:none}
.es-hidden .bubble .es{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.es-hidden .bubble.shown-es .es{filter:none}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:99px;padding:8px 18px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{opacity:.9}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Práctica ---------- */
.setup{display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.box h3{font-size:17px;font-weight:700;margin-bottom:2px}
.box .lede{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{font-size:13px;color:var(--muted);margin-top:4px}
.stage{max-width:620px;margin:0 auto}
.stage-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.qcard .ko{font-size:46px}
.qcard .es.big{font-size:24px;font-weight:500;margin:0}
.qcard .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.qcard .rom{font-size:18px}
.big-play{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.big-play:hover{border-color:var(--accent);color:var(--accent)}
.big-play svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:12px;align-items:baseline;font-size:16px;transition:border-color .15s,background .15s}
.opt .n{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none;transform:translateY(-1px)}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .o-ko{font-size:20px;font-weight:500}
.opt .rom{font-size:13.5px;margin-left:8px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-weight:700}
.feedback .fk{color:var(--ink)}
.fc-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.flip{cursor:pointer;width:100%;font:inherit;color:inherit}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px}
.result{text-align:center;padding:10px 0}
.result .score{font-size:56px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.result .score span{color:var(--muted);font-size:26px}
.review{margin:18px 0 0;display:grid;gap:8px;text-align:left}
.review .r-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.review .ko{font-size:20px}
.review .es{margin:0;font-size:13.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:18px 0 34px;color:var(--muted);font-size:12.5px}

@media (max-width:640px){
  .guide-body{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .ko{font-size:28px}
  .prow .ko{font-size:21px}
  .qcard .ko{font-size:40px}
  .tab{min-width:74px;padding:9px 8px 10px}
  .sec-head h2{font-size:23px}
  .msg{max-width:96%}
}
@media (max-width:380px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

/* ================= Repaso espaciado, cortesía y palacio ================= */
:root{
  --blue:#2D6AA3; --blue-soft:#DCE7F3;
  --lv-casual-bg:#F3E3B8; --lv-casual-ink:#6B4E00;
  --lv-polite-bg:var(--ok-soft); --lv-polite-ink:var(--ok);
  --lv-formal-bg:#DCE6F3; --lv-formal-ink:#22456E;
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#7FB2E8; --blue-soft:#1F2A38;
    --lv-casual-bg:#3B3320; --lv-casual-ink:#E8CB84;
    --lv-formal-bg:#1F2A38; --lv-formal-ink:#9DC3EE;
  }
}
.rom-off .rom:not(.shown):not(.always){filter:blur(6px);cursor:pointer;user-select:none}
.rom-off .rom.shown:not(.always){filter:none}
.tab{position:relative}
.badge{position:absolute;top:6px;left:calc(50% + 34px);background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;min-width:19px;text-align:center;line-height:19px}
.badge[hidden]{display:none}
.btn.sm{padding:5px 14px;font-size:13px}
.mini-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:18px 0 6px}
.lvl{display:inline-block;font-size:12.5px;font-weight:500;border-radius:99px;padding:2px 10px;line-height:1.5}
.lvl-casual{background:var(--lv-casual-bg);color:var(--lv-casual-ink)}
.lvl-polite{background:var(--lv-polite-bg);color:var(--lv-polite-ink)}
.lvl-formal{background:var(--lv-formal-bg);color:var(--lv-formal-ink)}
.big-lvl{font-size:15px;padding:4px 16px;margin-bottom:8px}

/* Hoy */
.today .counts{display:flex;gap:30px;margin-bottom:14px;flex-wrap:wrap}
.cn b{display:block;font-size:38px;font-weight:300;line-height:1.1}
.cn span{font-size:12.5px;color:var(--muted)}
.c-new b,.c-new{color:var(--blue)}
.c-lrn b,.c-lrn{color:var(--bad)}
.c-rev b,.c-rev{color:var(--ok)}
.counts-s{font-size:14px;font-weight:500}
.counts-s .cur{text-decoration:underline;text-underline-offset:4px}
.checks label{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:6px 0;font-size:15px}
.checks small{color:var(--muted);font-size:12.5px}
.checks input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;transform:translateY(2px)}
.fields{display:grid;gap:10px;margin-top:10px}
.fields label{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.fields input.field{max-width:120px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.stat-grid b{display:block;font-size:22px;font-weight:500;line-height:1.2}
.stat-grid span{font-size:12px;color:var(--muted)}
.forecast{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:8px}
.forecast > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.forecast i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
.forecast .fv{font-size:11px;color:var(--muted)}
.forecast .fl{font-size:11px;color:var(--muted)}

/* Estudio */
.qcard.srs{position:relative;min-height:230px;padding-top:40px}
.kind-tag{position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:500;padding:1px 10px;border-radius:99px;border:1px solid currentColor}
.k-new{color:var(--blue)} .k-learn{color:var(--bad)} .k-review{color:var(--ok)}
.ans-sep{width:60%;border:0;border-top:1px dashed var(--line);margin:16px 0 14px}
.ans{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.hintbtn{margin-top:12px;background:none;border:1px dashed var(--line);border-radius:99px;padding:4px 14px;font-size:12.5px;color:var(--muted)}
.hintbtn:hover{border-color:var(--muted)}
.mn-hint{margin-top:12px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 14px;max-width:44ch}
.mnb{margin-top:14px;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 16px;max-width:480px;width:100%;font-size:14px}
.mnb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:2px 0}
.mnb-row span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:78px}
.mnb p{margin-top:8px;line-height:1.5}
.forms{margin-top:14px;display:grid;gap:6px;width:100%;max-width:440px;text-align:left}
.frm{display:grid;grid-template-columns:78px 1fr;align-items:baseline;gap:0 10px;padding:6px 10px;border-radius:10px;border:1px solid transparent}
.frm.me{background:var(--surface-2);border-color:var(--line)}
.frm .fko{font-size:18px}
.frm .rom{grid-column:2;margin:0;font-size:13px}
.frm .lvl{grid-row:span 2;align-self:center;text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.gbtn{border:1px solid var(--line);border-top-width:3px;background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;transition:transform .1s}
.gbtn:hover{transform:translateY(-1px)}
.gbtn .gl{font-weight:500;font-size:14.5px}
.gbtn .gi{font-size:12px;color:var(--muted)}
.gbtn .gk{position:absolute;top:3px;right:6px;font-size:10px;color:var(--muted)}
.g1{border-top-color:var(--bad)} .g2{border-top-color:var(--muted)} .g3{border-top-color:var(--ok)} .g4{border-top-color:var(--blue)}

/* Cortesía */
.lvcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.lvcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lvcard h3{font-size:17px;margin-top:4px}
.lvrow{display:grid;grid-template-columns:minmax(140px,1fr) repeat(3,minmax(0,1.25fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.lvrow .lhead{padding:4px 6px;font-size:14.5px}
.form{position:relative;padding:6px 34px 6px 10px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.form .fko{font-size:19px;line-height:1.3}
.form .rom{font-size:13px;margin:0}
.form .lvl{font-size:11px;padding:0 8px}
.form .icon{position:absolute;top:3px;right:0;width:30px;height:30px}
.hide-forms .form:not(.shown) .fko,.hide-forms .form:not(.shown) .rom{filter:blur(6px);cursor:pointer;user-select:none}

/* Palacio */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--surface-2);border:2px solid var(--ink);border-radius:10px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:left;min-height:108px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s}
.room:hover{border-color:var(--accent)}
.room b{font-size:16px}
.room small{color:var(--muted);font-size:12px}
.room .bar{margin:auto 0 0;height:4px}
.locus{display:grid;grid-template-columns:32px 1fr auto;gap:2px 12px;padding:14px 8px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow)}
.locus .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.locus .lname{font-weight:700;font-size:15px;color:var(--accent)}
.locus .ko{font-size:24px}
.locus .sound,.ans .sound{font-size:13.5px;color:var(--rom);margin-top:6px}
.story{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
.story.c{text-align:center;max-width:46ch}
.dots{display:flex;gap:5px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);transform:scale(1.3)}
.dots i.done{background:var(--ink)}

/* Ventana de mnemotecnia */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:22px;width:min(520px,calc(100% - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,15,10,.55)}
.dlg-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px;font-weight:400}
.dlg-ko{font-size:34px;font-weight:500}
.field-l{display:grid;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
.field-l .field{color:var(--ink);width:100%}
textarea.field{min-height:100px;resize:vertical}
.tag-c{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px}
.card-top .mid{margin:0}

@media (max-width:760px){
  .lvrow{grid-template-columns:1fr}
  .lvcards{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{position:static}
  .brand p{display:none}
  .tab{min-width:66px;padding:9px 6px 10px;font-size:14px}
  .plan{grid-template-columns:repeat(2,1fr)}
  .grades{gap:6px}
  .gbtn .gl{font-size:13px}
  .locus{grid-template-columns:28px 1fr auto;gap:2px 8px}
}

/* ================= Inicio, lección, juego y descanso ================= */
.fl svg,.c svg,.em svg,.okc svg,.moon svg,.node svg,.reward svg,.xpchip svg,.rest-streak svg,.streak-big svg,.lvl svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.tab .dot{position:absolute;top:8px;left:calc(50% + 24px);width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tab .dot[hidden]{display:none}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:14px 18px;align-items:center;margin-bottom:14px}
.lvl-ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl-ring b{font-size:24px;font-weight:500}
.lvl-ring span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.pl-title{font-size:16px;font-weight:500;margin-bottom:6px}
.pl-mid small{color:var(--muted);font-size:12.5px}
.pl-stats{display:flex;gap:16px}
.stat{display:flex;flex-direction:column;align-items:center;min-width:44px;line-height:1.15}
.stat b{font-size:22px;font-weight:500}
.stat small{font-size:11px;color:var(--muted)}
.stat .fl{width:22px;height:22px;color:var(--muted);margin-bottom:1px}
.stat.streak.on .fl{color:var(--accent)}
.stat.streak.on .fl svg{fill:var(--accent-soft)}
.stat.shield .fl{color:var(--blue)}
.soft-note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 14px;margin:-4px 0 14px}
.mission{margin-bottom:14px;text-align:left}
.mission .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mission h2{font-size:24px;font-weight:500;margin:4px 0 6px;display:flex;align-items:center;gap:8px}
.mission .okc{width:26px;height:26px;color:var(--ok);display:inline-block}
.mission.done{border-color:var(--ok)}
.qmarks{display:flex;gap:8px}
.qmarks i{font-style:normal;width:44px;height:44px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;font-size:20px;color:var(--muted)}
.reward{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.reward svg{width:17px;height:17px;color:var(--accent)}
.chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.wchip{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:16px}
.wchip small{font-size:12px;color:var(--muted);margin-left:4px}
.wchip:hover{border-color:var(--accent)}
.week{display:flex;gap:6px;align-items:flex-end;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.wd small{font-size:11px;color:var(--muted);white-space:nowrap}
.wd .c{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;padding:7px;color:var(--bg)}
.wd.ok .c{background:var(--ok);border:1.5px solid var(--ok)}
.wd.sh .c{background:var(--blue);border:1.5px solid var(--blue)}
.wd.now .c{border:2px solid var(--accent)}
.wd.now small{color:var(--accent);font-weight:700}
.wd.miss .c{border-color:var(--bad);opacity:.6}
.wd.rest .c{border:1.5px solid var(--line);color:var(--muted);background:var(--surface-2)}
.wd.chest .c{border:1.5px solid var(--line);color:var(--muted)}
.wd.chest.got .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path{display:flex;flex-wrap:wrap;gap:8px 10px}
.node{width:46px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.node span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:500;border:1.5px solid var(--line);background:var(--surface);padding:0}
.node span svg{width:18px;height:18px}
.node small{font-size:8.5px;letter-spacing:0;color:var(--muted);line-height:1}
.node.done span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.node.cur span{border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node.lock{opacity:.5;cursor:default}
.node.peek span{outline:2px solid var(--accent);outline-offset:2px}
.peek-box{margin-top:14px;display:grid;gap:6px}
.peek-box .r-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 14px}
.achs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;opacity:.55}
.ach.on{opacity:1;background:var(--surface-2)}
.ach .em{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:500;padding:11px;color:var(--muted);margin-bottom:4px}
.ach.on .em{border-color:var(--accent);color:var(--accent);padding:0}
.ach b{font-size:13px;font-weight:500}
.ach small{font-size:11px;color:var(--muted);line-height:1.3}
.ach-new{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:13px}
.sci{display:grid;gap:12px}
.sci-row b{font-size:14px}
.sci-row p{font-size:13.5px;color:var(--muted);margin:1px 0}
.sci-row small{font-size:12px;color:var(--rom)}
.mission + .two,.two + .box{margin-top:0}
.player + .mission,.two,.box + .box,.box + .guide,.guide + .row{margin-bottom:14px}

/* Lección */
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 8px;flex-wrap:wrap}
.steps li{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.steps li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
.xpchip{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500}
.xpchip svg{width:15px;height:15px;fill:var(--accent-soft)}
.qcard.qlearn{padding:22px 18px;text-align:center}
.qcard.qlearn .forms{margin-left:auto;margin-right:auto}
.locus-big{font-size:26px;font-weight:500;color:var(--accent);margin:4px 0}
.dot-note{font-size:12px}
.done-box{padding:22px 16px}
.xp-big{font-size:46px;font-weight:300;color:var(--accent);line-height:1.1}
.xp-break{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:13px;color:var(--muted);margin:6px 0 12px}
.streak-big{display:inline-flex;align-items:center;gap:8px;font-size:16px;margin-bottom:10px}
.streak-big b{font-size:22px;font-weight:500}
.streak-big .fl{width:26px;height:26px;color:var(--accent)}
.streak-big .fl svg{fill:var(--accent-soft)}
.dwords{display:grid;gap:6px;text-align:left;max-width:460px;margin:0 auto}
.dwords .r-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 14px}
.done-box .hint{max-width:46ch;margin-left:auto;margin-right:auto}

/* Celebración */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
#confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:.95;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate(var(--dx),108vh) rotate(var(--rot))}}

/* Descanso: domingo y lunes */
body.locked{overflow:hidden}
#restLock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:24px 16px}
.rest-in{max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.rest-in .moon{width:88px;height:88px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;padding:22px;color:var(--ink);background:var(--surface-2);margin-bottom:6px}
.rest-in h1{font-size:40px;font-weight:500;letter-spacing:-.01em}
.rest-p{font-size:16px}
.rest-count{font-size:22px;font-weight:300;color:var(--accent)}
.rest-streak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:6px 18px;background:var(--surface)}
.rest-streak .fl{width:20px;height:20px;color:var(--accent)}
.rest-streak .fl svg{fill:var(--accent-soft)}
.rest-sci{font-size:13px;color:var(--muted);max-width:40ch;margin-top:6px}

@media (max-width:640px){
  .player{grid-template-columns:auto 1fr}
  .pl-stats{grid-column:1/-1;justify-content:space-around}
  .achs{grid-template-columns:repeat(2,1fr)}
  .tab .dot{left:calc(50% + 18px)}
  .rest-in h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){ #confetti{display:none} }
/* --- Sílabas sino-coreanas --- */
.sylbox{margin-top:12px;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 16px;width:100%;max-width:480px;font-size:14px}
.syl-h{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.sylrow{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}
.syl{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px}
.syl .sk{font-size:20px;font-weight:500}
.syl .sh{font-size:17px;color:var(--rom)}
.syl .sm{font-size:12.5px;color:var(--muted)}
.sylrow .sp{color:var(--muted);padding:0 2px}
.syl-more{margin-top:8px;font-size:12.8px;color:var(--muted);line-height:1.5}
.syl-more div+div{margin-top:3px}
.syl-more .ko{font-size:14px;color:var(--ink)}
/* --- Cortesía: modos --- */
.lvseg{margin:0 0 16px}
/* --- Oído --- */
.ear-tab{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ear-tab>div{background:var(--surface-2);border-radius:12px;padding:10px 14px}
.ear-tab b{font-size:14px}
.ear-tab .ko{font-size:16px;margin-left:6px;color:var(--rom)}
.ear-tab p{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.ear-rows{display:grid;gap:8px}
.ear-row{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.ear-row .ko,.ear-tab .ko,.guide-body .full .ko{font-size:1.15em;white-space:nowrap}
.ear-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ear-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ear-pct{font-size:13px;color:var(--muted);text-align:right}
.ear-opt .o-ko{font-size:26px}
.ear-es,.ear-ser{display:block;font-size:12.5px;color:var(--muted);margin:0}
.ear-tk{color:var(--muted);font-size:12px}
/* --- Plan, práctica corta y progreso --- */
.box.myplan{margin-bottom:14px}
.box.myplan .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box.myplan.due{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.box.myplan.due .tag{color:var(--accent);font-weight:500}
.plan-s{font-size:15px;margin:4px 0 0;line-height:1.5}
.plan-min{margin:0 0 14px;font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.minis{display:grid;gap:10px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:10px 12px 10px 14px}
.mini small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.mini .ko-s{font-size:13px;color:var(--muted);font-weight:300;margin-left:4px}
.mini .btn{flex:none}
.cando{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.cando li{display:flex;gap:8px;align-items:center}
.cando .okc{width:16px;height:16px;color:var(--ok);display:inline-block;flex:none}
@media (max-width:640px){
  .ear-tab{grid-template-columns:1fr}
  .ear-row{grid-template-columns:118px 1fr 36px}
  .mini{flex-direction:column;align-items:stretch}
}
.feedback .forms .fko{color:var(--ink)}
.feedback .forms{max-width:none}

/* ================= Secciones de Inicio, viaje, jardín, tienda, diario ================= */
.btn svg,.maleta svg,.st-n svg,.st-i svg,.tbox svg,.cd i svg,.pl svg,.pill svg,.rt i svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.btn svg{width:16px;height:16px}
.subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;margin:0 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{white-space:nowrap;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13.5px}
.pill .fl{width:16px;height:16px;display:inline-block;color:var(--muted)}
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;vertical-align:middle}
.avatar.big{width:44px;height:44px;font-size:24px}
.stat.coins .fl{color:var(--accent)}
.pl-stats{gap:14px}
.choose{margin:12px 0 4px}.choose>small{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickl{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.pickl:hover{border-color:var(--muted)}
.pickl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pickl span{font-size:12px;color:var(--accent);letter-spacing:1px}
.pickl small{font-size:12.5px;color:var(--muted);line-height:1.35}
/* cápsulas */
.capcard{margin-bottom:14px}.capcard .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface)}
.cap-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px}
.cap-h .ko{font-size:20px;min-width:52px;text-align:center}
.cap-h small{display:block;color:var(--muted);font-size:12.5px}
.cap-b{padding:0 14px 12px}.cap-b p{margin:0 0 6px;font-size:15px}
.cap.read .cap-h .ko{color:var(--muted)}
/* comparar palabras (laboratorio) */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin-top:8px}
.cmp .vs{align-self:center;color:var(--muted);font-size:13px}
.cmpcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.cmpcol .ko{font-size:30px}
.cmp-mn{margin-top:0;text-align:center;font-size:13px}
/* viaje */
.route{display:flex;align-items:flex-start;justify-content:space-between;margin:8px 0 2px;gap:0}
.rt{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:44px}
.rt i{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--muted);padding:6px}
.rt.on i{border-style:solid;border-color:var(--ink);color:var(--ink)}
.rt.cur i{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.rt.pass i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rt small{font-size:11px;color:var(--muted)}
.rl{flex:1;height:1.5px;background:var(--line);margin-top:16px;min-width:6px}
.scard.lock{opacity:.6}
.scard.cur{border-color:var(--accent)}
.st-h{display:flex;gap:12px;align-items:center}
.st-h>div{flex:1}
.st-h b{font-size:20px;font-weight:500}
.st-n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none;padding:7px}
.scard.pass .st-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-i{width:20px;height:20px;color:var(--muted)}
.maleta{margin:8px 0}.maleta>span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:4px}.maleta>span svg{width:16px;height:16px}
.maleta small{color:var(--muted);font-size:12px}
.boss-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.boss-row .es{font-size:13px;color:var(--muted)}
.stamp{width:66px;height:66px;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);transform:rotate(-8deg);flex:none;line-height:1.1}
.stamp span{font-size:18px}.stamp small{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.stamp.on{border:2.5px solid var(--accent);color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--accent-soft)}
.passport{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
/* lecturas */
.rcard{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0}
.rcard:first-of-type{border-top:0}
.rcard.lock{opacity:.7}
.ndw{font-size:13px;padding:1px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}
.ndw.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rtext{margin:14px 0 6px;display:flex;flex-direction:column;gap:14px}
.rline{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end}
.tk{background:none;border:0;border-bottom:2px solid transparent;padding:2px 3px;display:flex;flex-direction:column;align-items:center;line-height:1.2;border-radius:6px}
.tk>span:first-child{font-size:24px}
.tk .rom{font-size:11.5px}
.tk.known{border-bottom-color:var(--ok)}
.tk.app{opacity:.55;border-bottom-color:var(--line)}
.tk.extra{border-bottom:2px dotted var(--muted)}
.tk.who{color:var(--muted);font-size:13px;border:0}
.tk.who>span:first-child{font-size:14px;text-transform:none}
.tk.join{margin-left:-8px}
.tk.sel{background:var(--accent-soft)}
.gloss{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;flex-direction:column;gap:2px;position:relative}
.gloss .icon{position:absolute;right:8px;top:8px}
.gloss small{color:var(--muted);font-size:12.5px}
.gloss-h{margin:8px 0}
.rq{margin:10px 0}.rq p{margin:0 0 6px}
.rq-o{display:grid;gap:8px}
/* jardín */
.pl-legend{display:flex;flex-wrap:wrap;gap:6px 18px}
.pl-leg{display:flex;align-items:center;gap:6px}
.pl-leg b{font-weight:500}.pl-leg small{color:var(--muted);font-size:12.5px}
.pl{width:26px;height:26px;display:inline-block;color:var(--ok)}
.pl svg{width:100%;height:100%}
.pl.s0,.plant.s0 .pl{color:var(--muted)}.pl.s3,.plant.s3 .pl{color:var(--accent)}.pl.s4,.plant.s4 .pl{color:var(--ink)}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:10px}
.plant{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.plant .pl{width:30px;height:30px}
.plant .pk{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.plant.thirsty{border-style:dashed;opacity:.72}
.plant.thirsty::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.plant.wilt .pl{transform:rotate(14deg);filter:saturate(.4)}
.plant:hover{border-color:var(--muted)}
/* retos */
.quest.done{border-color:var(--ok)}
.qoffer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qopt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.qopt:hover{border-color:var(--accent)}
.qopt b{font-weight:600}.qopt span{font-size:13.5px;color:var(--ink)}.qopt small{font-size:12px;color:var(--muted);margin-top:auto}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.qrow .es{font-size:14px;color:var(--muted)}
.xrow{gap:10px}
.xrow .btn{flex-direction:column;align-items:flex-start;gap:0;border-radius:14px;padding:8px 18px}
.xrow .btn small{font-size:11.5px;opacity:.75}
.xrow .btn[disabled]{opacity:.45;cursor:default}
.pairs{display:grid;gap:8px}
.pair{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.pair span{font-size:20px}.pair i{color:var(--muted);font-style:normal}.pair small{margin-left:auto;color:var(--muted);font-size:12px}
.dchart{display:flex;gap:10px;align-items:flex-end;height:110px;margin:12px 0 4px;padding-bottom:36px;position:relative}
.dbar{flex:1;max-width:44px;height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.dbar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;opacity:.85}
.dbar b{position:absolute;top:-2px;font-size:12px;font-weight:500;left:0;right:0;text-align:center;transform:translateY(-100%)}
.dbar small{position:absolute;bottom:-20px;font-size:11px;color:var(--muted);left:0;right:0;text-align:center}
.teach-w{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin:10px 0}
.tsteps{display:grid;gap:6px}
.tstep{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px}
.tstep[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.tbox{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;padding:2px;margin-top:1px}
.tstep[aria-pressed="true"] .tbox{background:var(--ok);border-color:var(--ok);color:var(--bg)}
/* adaptativa */
.adapt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:12px 0}
.adapt .ad-l{font-size:14px}.adapt small{flex-basis:100%;color:var(--muted);font-size:12.5px}
.adapt .ad-msg,.ad-msg{color:var(--accent);font-weight:500}
.seg.sm button{padding:3px 11px;font-size:13px}
/* tienda */
.coinbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.coinbar .fl{width:26px;height:26px;color:var(--accent)}.coinbar b{font-size:28px;font-weight:500}.coinbar small{color:var(--muted)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;background:var(--surface)}
.sitem.on{border-color:var(--accent)}
.sitem.row1{flex-direction:row;text-align:left;gap:12px;padding:12px 14px}
.sw{display:flex}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-left:-6px}.sw i:first-child{margin-left:0}
.btn[aria-disabled="true"]{opacity:.5}
.btn svg + *{margin-left:0}
.gain{display:grid;gap:4px}.gain div{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dashed var(--line);padding:3px 0}.gain b{font-weight:500;color:var(--accent)}
/* diario */
.cal{max-width:520px;margin:0 auto}
.box h3 + .stat-grid{margin-top:10px}
.pl-stats{align-items:flex-end}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h small{text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:4px}
.cd{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;font-size:12.5px;color:var(--muted);background:var(--surface)}
.cd.blank{border:0;background:none}
.cd.rest{background:var(--surface-2);border-style:dashed;opacity:.7}
.cd.fut,.cd.pre{opacity:.4;border-style:dashed}
.cd.miss{border-color:var(--bad);color:var(--bad);background:transparent}
.cd.part{border-color:var(--accent);color:var(--accent)}
.cd.ok{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.cd.ok.l1{opacity:.55}.cd.ok.l2{opacity:.72}.cd.ok.l3{opacity:.88}
.cd.ok.l1,.cd.ok.l2,.cd.ok.l3{color:var(--accent-ink)}
.cd.sh{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.cd.sh i{position:absolute;top:1px;right:2px;width:11px;height:11px}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.cal-leg span{display:flex;align-items:center;gap:6px}.cal-leg .cd{width:14px;height:14px;aspect-ratio:auto;border-radius:4px;display:inline-block}
.stat-grid small{display:block;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){
  .qoffer{grid-template-columns:1fr}
  .pickrow{grid-template-columns:1fr 1fr}
  .pl-stats{flex-wrap:wrap;gap:10px 14px}
  .cal-h,.cal-g{gap:3px}
  .rcard{flex-direction:column;align-items:flex-start}
  .boss-row{flex-direction:column;align-items:flex-start}
}
/* colores personalizados */
:root[data-skin="cerezo"]{--accent:#B84A6E;--accent-ink:#FFFFFF;--accent-soft:#F5DFE7}
:root[data-skin="bosque"]{--accent:#3F7A4F;--accent-ink:#FFFFFF;--accent-soft:#DDEBDF}
:root[data-skin="oceano"]{--accent:#2D6AA3;--accent-ink:#FFFFFF;--accent-soft:#DCE7F3}
:root[data-skin="ciruela"]{--accent:#6B4E9B;--accent-ink:#FFFFFF;--accent-soft:#E6DFF1}
:root[data-skin="tinta"]{--accent:#211F1C;--accent-ink:#FBFAF6;--accent-soft:#E4E0D6}
@media (prefers-color-scheme: dark){
  :root[data-skin="cerezo"]{--accent:#E58DA8;--accent-ink:#1A1013;--accent-soft:#3B2530}
  :root[data-skin="bosque"]{--accent:#7CC496;--accent-ink:#0F1A13;--accent-soft:#1F2F25}
  :root[data-skin="oceano"]{--accent:#7FB2E8;--accent-ink:#0E1620;--accent-soft:#1F2A38}
  :root[data-skin="ciruela"]{--accent:#B79AE3;--accent-ink:#17111F;--accent-soft:#2C2338}
  :root[data-skin="tinta"]{--accent:#EDE8DF;--accent-ink:#161513;--accent-soft:#34302A}
}

/* ---------- Gramática ---------- */
.gtitle{font-size:30px;font-weight:500;line-height:1.25;margin:2px 0}
.gcard .gt{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:6px 0 4px}
.gcard .gt b{font-size:22px;font-weight:500}.gcard .gt span{color:var(--muted)}
.gexs{display:grid;gap:8px;margin:12px 0;text-align:left;width:100%}
.gex{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qcard .gex .ko,.gex .ko{font-size:22px;grid-column:1;line-height:1.35}
.gex .rom{grid-column:1;font-size:14px}.gex .es{grid-column:1;color:var(--muted);font-size:14px}
.gex .icon{grid-column:2;grid-row:1 / span 3;align-self:center}
mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:500}
.gsent{font-size:30px;line-height:1.5;margin:6px 0 4px}
.gblank{display:inline-block;min-width:2em;padding:0 4px;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;margin:0 2px}
.gblank.done{border-bottom-color:var(--ok);color:var(--ok)}
.gq{font-size:17px;line-height:1.5;max-width:34em}
.grule{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:15px;text-align:left;border:1px solid var(--line);background:var(--surface)}
.grule.ok{border-color:var(--ok)}.grule.no{border-color:var(--accent)}
.grule > b{display:block;margin-bottom:6px}.grule p{margin:0 0 8px}
.gnw{margin-top:6px;text-align:left;width:100%;font-size:14px}
.gchip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--surface-2)}
.gseq{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;margin:12px 0 4px;border:1px dashed var(--line);border-radius:14px}
.gseq.ok{border-style:solid;border-color:var(--ok)}.gseq.no{border-style:solid;border-color:var(--bad)}
.gbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.gtok{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:20px}
.gtok:hover:not([disabled]){border-color:var(--accent)}.gtok[disabled]{cursor:default;opacity:.8}
.grow{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:8px 0}
.grow > summary,.grow.lock{display:flex;align-items:center;gap:12px;padding:12px 14px;list-style:none;cursor:pointer}
.grow > summary::-webkit-details-marker{display:none}
.grow.lock{opacity:.62;cursor:default}
.grow[open] > summary{border-bottom:1px solid var(--line)}
.gn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:var(--muted)}
.gn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--ok)}
.grow .gt{flex:1;min-width:0;display:flex;flex-direction:column}.grow .gt b{font-size:17px;font-weight:500}.grow .gt small{color:var(--muted);font-size:13px}
.gst{font-size:12px;color:var(--muted);text-align:right;max-width:9em}.gst.ok{color:var(--ok)}.gst.on{color:var(--accent)}
.gbody{padding:12px 14px 14px;font-size:15px}.gbody p{margin:0 0 8px}
@media (max-width:520px){.gsent{font-size:26px}.gtitle{font-size:26px}}

/* ---------- Juegos ---------- */
.gmstage .stage-top .btn{white-space:nowrap;flex:none}.gmstage #gmTitle{min-width:0;text-align:center;line-height:1.2}
:root{--gy:#9A7414}
@media (prefers-color-scheme: dark){:root{--gy:#D9B450}}
.gmstage{max-width:680px}
.gmsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;padding:14px;margin-bottom:4px}
.gmsum b{display:block;font-size:20px;font-weight:500;line-height:1.2}.gmsum span{font-size:12px;color:var(--muted)}
.gmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gmcard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;box-shadow:var(--shadow)}
.gmcard:hover:not(.lock){border-color:var(--accent)}
.gmcard.lock{opacity:.55}
.gmcard .tag-c{position:absolute;top:8px;right:10px;margin:0}
.gmk{font-size:22px;font-weight:500;min-width:62px;text-align:center;color:var(--accent);line-height:1.2;flex:none}
.gmk.big{display:block;font-size:44px;margin-bottom:2px}
.gb{display:flex;flex-direction:column;gap:2px;min-width:0}.gb b{font-weight:500}.gb small{color:var(--muted);font-size:12.5px;line-height:1.35}
.gmsetup{text-align:center;max-width:520px;margin:0 auto}.gmsetup h3{font-size:22px}.gmsetup .lede{margin:6px auto 14px}
.gmopt{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:10px}
.gmopt>span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gmstage .row{display:flex;flex-wrap:wrap;gap:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes popf{to{opacity:0}}
.shake{animation:shake .28s}
/* teclado coreano y latino en pantalla */
.kbd{display:flex;flex-direction:column;gap:6px;margin:14px auto 0;max-width:600px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kr{display:flex;gap:5px;justify-content:center}
.kr.r2{padding:0 3%}
.kk{position:relative;flex:1 1 0;min-width:0;max-width:58px;height:50px;border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.kk b{font-size:20px;font-weight:500}
.kk .kl{position:absolute;left:4px;bottom:0;font-size:9.5px;color:var(--muted);font-style:normal;text-transform:uppercase;line-height:1.3}
.kk .ks{position:absolute;right:4px;top:0;font-size:10.5px;color:var(--muted);font-style:normal;line-height:1.3}
.kk:active{transform:translateY(1px);border-bottom-width:2px}
.kk.hi{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.kk.wide{flex:1.5 1 0;max-width:86px;font-size:13px}
.kk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kk.space{flex:6 1 0;max-width:340px;font-size:13px;color:var(--muted)}
.kk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kk.g{background:var(--ok);border-color:var(--ok);color:var(--bg)}.kk.g .kl,.kk.y .kl{color:inherit;opacity:.8}
.kk.y{background:var(--gy);border-color:var(--gy);color:var(--bg)}
.kk.x{opacity:.35}
/* mecanografía */
.gmtype .tp-ko{font-size:42px}.gmtype .tp-ko.hid{color:var(--muted);letter-spacing:.2em}
.tline{font-size:26px;letter-spacing:.05em;margin-top:8px;color:var(--muted);font-weight:500;min-height:1.6em;word-break:break-all}
.tline .ok{color:var(--ok)}.tline .cur{border-bottom:2px solid var(--accent);color:var(--ink)}
.ttyped{font-size:34px;min-height:1.6em;margin-top:10px;border-bottom:2px solid var(--line);padding:0 16px;min-width:140px}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(1) infinite}
.tinwrap{display:flex;justify-content:center;margin-top:14px}
.tinput{width:100%;max-width:420px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;text-align:center}
.tinput:focus{border-color:var(--accent);outline:none}
/* lluvia de palabras */
.rain{position:relative;height:min(52vh,400px);min-height:280px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(var(--surface),var(--surface-2));overflow:hidden;box-shadow:var(--shadow)}
.rfloor{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bad);opacity:.5}
.rw{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);will-change:transform;line-height:1.2}
.rw .rk{font-size:24px;font-weight:500}.rw .re{font-size:11px;color:var(--muted);max-width:15ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .rh{font-size:12px;color:var(--rom);opacity:0;transition:opacity .3s}.rw.late .rh{opacity:1}.rw .rh b{color:var(--ok)}
.rw.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.rw .m{color:var(--ok)}
.rw.pop{animation:popf .25s forwards;border-color:var(--ok)}
.rain.hit{box-shadow:inset 0 -22px 30px -14px var(--bad-soft)}
.rpause{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:var(--bg);opacity:.92;font-weight:500;z-index:3}
.rain.paused .rpause{display:flex}
.rainbar{text-align:center;margin:10px auto 0;font-size:26px;min-height:1.6em;border-bottom:2px solid var(--line);max-width:300px}
/* pares */
.gmpares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcol{display:grid;gap:10px;align-content:start}
.pc{min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pc .ko{font-size:22px;line-height:1.2}.pc .rom{font-size:12.5px;margin:0}.pc.es{font-size:15px}
.pc.sel{border-color:var(--accent);background:var(--accent-soft)}.pc.ok{border-color:var(--ok);background:var(--ok-soft)}.pc.bad{border-color:var(--bad);background:var(--bad-soft)}
/* semáforo, torre, palacio, sombra, bingo */
.semrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sembtn{position:relative;border:1.5px solid var(--line);border-top-width:5px;border-radius:14px;background:var(--surface);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sembtn b{font-size:20px;font-weight:500}.sembtn small{font-size:12px;color:var(--muted)}.sembtn i{position:absolute;top:2px;left:8px;font-size:11px;color:var(--muted);font-style:normal}
.sembtn.lvl-casual{border-top-color:var(--bad)}.sembtn.lvl-polite{border-top-color:var(--ok)}.sembtn.lvl-formal{border-top-color:var(--gy)}
.sembtn.right{background:var(--ok-soft);border-color:var(--ok)}.sembtn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.sembtn:disabled{cursor:default}
.towbar{margin-bottom:8px}
.ptrail{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px;align-items:center}
.ptrail span.on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--accent)}.ptrail i{font-style:normal;opacity:.5}
.shbar{width:100%;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}.shbar i{display:block;width:0;height:100%;background:var(--accent)}
.shcount{font-size:54px;font-weight:300;color:var(--accent);line-height:1.2}
.shw{padding:0 3px;border-radius:6px;transition:background .15s}.shw.on{background:var(--accent-soft);color:var(--accent)}
.bingo{display:grid;gap:8px;margin-top:14px}.bingo.b3{grid-template-columns:repeat(3,1fr)}.bingo.b4{grid-template-columns:repeat(4,1fr)}
.bc{min-height:74px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bc .ko{font-size:20px;line-height:1.25}.bc .rom{font-size:11.5px;margin:0}.b4 .bc .ko{font-size:17px}
.bc.mark{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.bc.bad{border-color:var(--bad);background:var(--bad-soft)}
/* caja registradora */
.cajain{font-size:34px;font-weight:500;min-height:1.6em;margin-top:12px;padding:4px 22px;border-bottom:2px solid var(--line);min-width:190px}
.cajain.ok{border-color:var(--ok);color:var(--ok)}.cajain.no{border-color:var(--bad);color:var(--bad)}.cajain .ph{color:var(--line)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:14px auto 0}
.kp{height:54px;border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;background:var(--surface);font-size:22px;font-weight:500;display:grid;place-items:center}
.kp.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:16px}
.kp svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* wordle */
.wgrid{display:grid;gap:6px;margin:14px auto 0;width:fit-content}
.wr{display:grid;grid-template-columns:repeat(var(--n),auto);gap:6px}
.wc{width:min(52px,calc((100vw - 64px) / var(--n)));height:min(52px,calc((100vw - 64px) / var(--n)));border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:24px;font-weight:500;background:var(--surface)}
.wc.cur{border-color:var(--muted)}
.wc.g{background:var(--ok);border-color:var(--ok);color:var(--bg)}.wc.y{background:var(--gy);border-color:var(--gy);color:var(--bg)}.wc.x{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.wprev{text-align:center;font-size:24px;min-height:1.6em;margin-top:8px}.wmsg{text-align:center;font-size:13px;color:var(--muted);min-height:1.4em}
.wreveal{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0}
/* radar */
.radar-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:center}
.radar svg{width:100%;height:auto;max-width:360px;margin:0 auto;display:block}
.rr{fill:none;stroke:var(--line);stroke-width:1}.rs{stroke:var(--line);stroke-width:1}
.rp{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}.rd{fill:var(--accent)}
.rdl{font-size:12px;fill:var(--muted)}.rdlk{font-size:14px;fill:var(--ink);font-weight:500}
.skrows{display:grid;gap:10px}
.skrow{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:baseline}
.skrow b{grid-area:1/1;font-weight:500}.skrow span{grid-area:1/2;font-size:13.5px;color:var(--muted)}.skrow small{grid-area:1/3;font-size:12px;color:var(--muted)}.skrow .bar{grid-area:2/1/3/4;margin:3px 0 0}
.sktip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:10px 14px;background:var(--surface-2);border-radius:12px;font-size:14px}
@media(max-width:640px){.radar-in{grid-template-columns:1fr}.gmsum{grid-template-columns:repeat(2,1fr)}}
/* álbum y sellos */
.seal{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-size:22px;font-weight:500;background:var(--surface);flex:none}
.seal.off{border-style:dashed;border-color:var(--line);color:var(--line)}
.avatar.off{filter:grayscale(1);opacity:.5}
.albgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.alb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center}
.alb b{font-size:13px;font-weight:500}.alb small{font-size:11.5px;color:var(--muted)}.alb .bar{width:80%;margin:4px 0 0}
.alb.open{border-color:var(--accent)}.alb.full{background:var(--accent-soft)}
.albdet{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.albwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.aw{border:1px solid var(--line);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:62px;justify-content:center;background:var(--surface);min-width:0}
.aw.got{border-color:var(--accent);background:var(--accent-soft)}.aw .ko{font-size:17px;line-height:1.3}
.aw small{font-size:10.5px;color:var(--muted);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aw.grow{border-style:dashed;opacity:.85}.aw.grow .pl{width:24px;height:24px}.aw.lock{border-style:dotted;color:var(--line)}
/* temporadas */
.season{margin-bottom:14px}.season .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sea-h{display:flex;gap:14px;align-items:center;margin:8px 0}.season h3{font-size:19px}
.sea-prog{margin:4px 0 10px}.sea-prog small{color:var(--muted);font-size:12.5px}
.sea-lines{display:grid;gap:8px}
.sl{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column}
.sl .ko{font-size:22px}.sl .es{color:var(--muted);font-size:14.5px}.sl.on{border-color:var(--accent)}
.sea-q{margin-top:14px}
.sealist{display:grid;gap:8px}
.srow{display:flex;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.srow .seal{width:38px;height:38px;font-size:19px}.srow small{display:block;color:var(--muted);font-size:12.5px}.srow>span:nth-child(2){flex:1;min-width:0}
.srow.now{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- Instalada (PWA), iPhone y respaldo ---------- */
html{-webkit-tap-highlight-color:transparent}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.top{padding-top:env(safe-area-inset-top)}
.toast{bottom:calc(22px + env(safe-area-inset-bottom))}
footer{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
button,.tab,.chip,.opt{touch-action:manipulation}
@media (pointer:coarse){input,select,textarea,.field{font-size:16px}}
.pwabar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);font-size:14px}
.pwabar span{flex:1 1 220px;min-width:0}
.pwabar .btn{background:var(--bg);color:var(--ink);border-color:transparent;min-height:36px;padding:6px 14px}
.pwabar .btn.ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.pwabar.warn{background:var(--bad);color:#fff}
.bkcard{border-color:var(--accent);background:var(--accent-soft);margin-bottom:14px}.bkcard .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.bkrow small span{white-space:nowrap}
.bkcard p{margin:6px 0 0}
.bksnaps{display:flex;flex-direction:column;gap:6px}
.bkrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bkrow>span{min-width:0}.bkrow b{font-weight:500;font-size:14px;display:block}.bkrow small{color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion: reduce){.caret,.shake{animation:none}}

<script>
/* ================= Almacenamiento: IndexedDB + espejo en localStorage =================
   - localStorage es la copia de trabajo (síncrona, como siempre); IndexedDB es la copia duradera.
   - Al abrir: si localStorage tiene datos la app arranca al instante y IndexedDB se concilia por detrás;
     si localStorage está vacío (el navegador lo borró) se recupera todo desde IndexedDB antes de arrancar.
   - meta = { schema, appVer, first, lastExport, lastSnap, ... }: versión del esquema y de la app.
   - Antes de migrar o de cambiar de versión se guarda una copia (snapshot) por si algo sale mal.
   - Si el progreso guardado viene de una versión MÁS NUEVA que este archivo, no se escribe nada (para no dañarlo). */
const KRS = (() => {
  const PFX = 'kr.', DBN = 'kr-coreano', SCHEMA = 1, APP_VER = '2026.09.19-2335';
  const MIGRATIONS = {};
  const SKIP = { meta: 1, __ts: 1, premig: 1, rl: 1 };                    // claves que no son datos del usuario
  const mem = new Map(); let lsOK = true;
  try { localStorage.setItem(PFX + '__t', '1'); localStorage.removeItem(PFX + '__t'); } catch (e) { lsOK = false; }
  const raw = {
    get: k => { if (!lsOK) return mem.has(k) ? mem.get(k) : null; try { return localStorage.getItem(PFX + k); } catch (e) { return mem.has(k) ? mem.get(k) : null; } },
    set: (k, v) => { mem.set(k, v); if (!lsOK) return true; try { localStorage.setItem(PFX + k, v); return true; } catch (e) { return false; } },
    del: k => { mem.delete(k); if (!lsOK) return; try { localStorage.removeItem(PFX + k); } catch (e) { /* nada */ } },
    keys: () => { if (!lsOK) return [...mem.keys()]; const o = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(PFX) === 0) o.push(k.slice(PFX.length)); } } catch (e) { /* nada */ } return o; }
  };
  const dataKeys = () => raw.keys().filter(k => !SKIP[k]);
  const collect = () => { const o = {}; dataKeys().forEach(k => { const v = raw.get(k); if (v != null) o[k] = v; }); return o; };
  const json = (s, d) => { try { return s == null ? d : JSON.parse(s); } catch (e) { return d; } };
  const meta = () => json(raw.get('meta'), {}) || {};
  const setMeta = patch => { const m = Object.assign(meta(), patch); raw.set('meta', JSON.stringify(m)); queue('meta', JSON.stringify(m)); return m; };

  const S = { snapped: false, frozen: false, idb: null, persistent: null, recovered: false, migrated: false, notices: [], exporter: null, booted: false };

    let done = false; const fin = v => { if (!done) { done = true; res(v); } };

      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('snap')) d.createObjectStore('snap', { keyPath: 'id', autoIncrement: true }); if (!d.objectStoreNames.contains('fsa')) d.createObjectStore('fsa'); };
      r.onsuccess = () => fin(r.result); r.onerror = () => fin(null); r.onblocked = () => fin(null);
    } catch (e) { fin(null); }
    setTimeout(() => fin(null), ms || 4000);
  });
  const getDB = () => dbP || (dbP = openDB(4000).then(d => { S.idb = !!d; return d; }));
  const tx = (store, mode, fn) => getDB().then(db => !db ? null : new Promise(res => {
    try { const t = db.transaction(store, mode), s = t.objectStore(store); let out; const r = fn(s, v => { out = v; }); t.oncomplete = () => res(out === undefined ? r : out); t.onerror = t.onabort = () => res(null); } catch (e) { res(null); }
  }));
  const idbAll = store => getDB().then(db => !db ? null : new Promise(res => {
    try { const o = {}, t = db.transaction(store, 'readonly'), c = t.objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { o[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(o); t.onerror = t.onabort = () => res(null); } catch (e) { res(null); }
  }));

  /* --- escritura: espejo inmediato + IndexedDB con retraso --- */
  const pending = new Map(); let tm = 0, fsaLast = 0;

  }

    if (S.frozen) return false;

  };
  const del = k => { if (S.frozen) return; raw.del(k); raw.set('__ts', String(Date.now())); queue(k, null); };
  const kvApi = { get, set, del, keys: dataKeys };

  const pruneSnaps = () => tx('snap', 'readwrite', s => {
    const all = []; const c = s.openCursor();
    c.onsuccess = () => {
      const cur = c.result;
      if (cur) { const v = cur.value; all.push({ id: v.id, t: v.t, kind: v.kind }); cur.continue(); return; }
      ['auto', 'sys'].forEach(kind => all.filter(x => x.kind === kind).sort((a, b) => b.t - a.t).slice(kind === 'auto' ? 7 : 6).forEach(x => s.delete(x.id)));

    return tx('snap', 'readwrite', (s, out) => { const r = s.add({ t: Date.now(), reason, kind: kind || 'sys', kv, size }); r.onsuccess = () => out(r.result); })

  }
  const listSnaps = () => getDB().then(db => !db ? [] : new Promise(res => {
    try { const o = [], t = db.transaction('snap', 'readonly'), c = t.objectStore('snap').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { const v = cur.value; o.push({ id: v.id, t: v.t, reason: v.reason, kind: v.kind, size: v.size, n: Object.keys(v.kv).length }); cur.continue(); } }; t.oncomplete = () => res(o.sort((a, b) => b.t - a.t)); t.onerror = t.onabort = () => res([]); } catch (e) { res([]); }
  }));

    pending.clear(); clearTimeout(tm);                                  // escrituras pendientes viejas no deben pisar lo restaurado

    Object.keys(kv).forEach(k => raw.set(k, kv[k]));
    raw.set('__ts', String(Date.now()));
    return tx('kv', 'readwrite', s => { s.clear(); Object.keys(kv).forEach(k => s.put(kv[k], k)); const m = raw.get('meta'); if (m != null) s.put(m, 'meta'); s.put(raw.get('__ts'), '__ts'); });
  }

    if (!sn) return false;

  });

  /* --- migraciones y versión --- */
  function prepare() {
    const had = dataKeys().length > 0, m = meta(), stored = had ? (m.schema || 1) : SCHEMA;
    if (stored > SCHEMA) { S.frozen = true; note('frozen', `Tu progreso viene de una versión más nueva de la app (esquema ${stored}); esta es más antigua (esquema ${SCHEMA}). Para no dañarlo, esta versión no guardará cambios. Abre la versión más reciente.`); return; }
    let snapped = false;
    if (had && stored < SCHEMA) {
      const before = collect(); S.snapped = true; snapshot(`Antes de migrar el guardado (v${stored} → v${SCHEMA})`, 'sys', before); snapped = true;
      try { raw.set('premig', JSON.stringify({ t: Date.now(), from: stored, kv: before })); } catch (e) { /* sin espacio */ }
      try { for (let v = stored + 1; v <= SCHEMA; v++) if (MIGRATIONS[v]) MIGRATIONS[v](kvApi); S.migrated = true; note('migrated', `Tu progreso se actualizó al formato nuevo (v${SCHEMA}). Se guardó una copia antes.`); }

  function reconcile() {
    getDB().then(db => {
      if (!db) return null;
      return idbAll('kv').then(rec => {

      <option value="todo">Vocabulario por aprender</option>

    </optgroup>`;

function buildPool(src) {
  if (src === 'todo') return VOCAB.filter(w => !learned.has(w.ko));
  if (src === 'fav') return ALL.filter(w => fav.has(w.ko));
  const [t, id] = src.split(':');
  const base = t === 'p' ? PHRASES : VOCAB;
  return id === 'all' ? base.slice() : base.filter(w => w.cat === id);
}
function distractors(item, pool, key, opt) {                       // opt: { n: cuántos, similar: preferir parecidos (mismo tema y largo) }
  const base = s => norm(s).split(/[\s(/,]+/)[0], n = (opt && opt.n) || 3;
  const ok = x => x.ko !== item.ko && x[key] !== item[key] && (item.kind === 'p' || base(x.es) !== base(item.es));
  let c = pool.filter(ok);
  if (c.length < 3) c = c.concat(ALL.filter(x => x.kind === item.kind && ok(x) && !c.includes(x)));
  if (opt && opt.similar) { const sim = x => (x.cat === item.cat ? 2 : 0) + (Math.abs(x.ko.length - item.ko.length) <= 1 ? 1 : 0) + Math.random(); return c.sort((a, b) => sim(b) - sim(a)).slice(0, n); }
  return shuffle(c).slice(0, n);
}

/* ---- Quiz ---- */
function startQuiz(pool, mode, only) {
  if (pool.length < 4) return toast('Necesitas al menos 4 elementos en la selección para el quiz.');
  if (mode === 'listen' && !hasTTS) return toast('Tu navegador no admite audio. Elige otro tipo de quiz.');
  const items = only ? shuffle(only) : shuffle(pool).slice(0, 10);
  ad.quiz.sess = { n: 0, ok: 0 }; ad.quiz.msg = '';
  prac.quiz = { items, pool, mode, i: 0, score: 0, wrong: [], answered: false, opts: [] };
  rv.view = 'quiz'; renderReview();
}
function makeOptions(q) {
  const it = q.items[q.i], key = q.mode === 'es-ko' ? 'ko' : 'es';
  const L = adLevel('quiz');                                      // Base: 3 opciones · Reto: 4 · Experto: 4 con distractores parecidos
  q.opts = shuffle([it].concat(distractors(it, q.pool, key, { n: L === 1 ? 2 : 3, similar: L === 3 })));
}
function renderQuiz() {
  const q = prac.quiz;
  if (q.i >= q.items.length) { rv.view = 'result'; return renderResult(); }
  const it = q.items[q.i];
  if (!q.opts.length) makeOptions(q);
  let prompt;
  if (q.mode === 'ko-es') prompt = `<span class="tag">¿Qué significa?</span><div class="ko" lang="ko" style="${it.kind === 'p' ? 'font-size:30px' : ''}">${esc(it.ko)}</div><div class="rom rom-static">${esc(it.rom)}</div>`;
  else if (q.mode === 'es-ko') prompt = `<span class="tag">¿Cómo se dice en coreano?</span><div class="es big">${esc(it.es)}</div>`;
  else prompt = `<span class="tag">Escucha y elige el significado</span><button class="big-play" id="replay" aria-label="Escuchar de nuevo">${ICON.speaker}</button>`;
  const opts = q.opts.map((o, i) => {
    const body = q.mode === 'es-ko'
      ? `<span><span class="o-ko" lang="ko">${esc(o.ko)}</span><span class="rom rom-static">${esc(o.rom)}</span></span>`
      : `<span>${esc(o.es)}</span>`;
    return `<button class="opt" data-i="${i}"><span class="n">${i + 1}</span>${body}</button>`;
  }).join('');
  rvEl.innerHTML = `<div class="stage">
    <div class="stage-top"><button class="btn ghost" id="back" style="padding:5px 14px;font-size:13px">← Salir</button><span>Pregunta ${q.i + 1} de ${q.items.length} · ${q.score} correctas</span></div>
    <div class="bar"><i style="width:${q.i / q.items.length * 100}%"></i></div>
    <div class="qcard">${prompt}</div>
    <div class="opts" id="opts">${opts}</div>
    <div id="fb"></div>
  </div>`;
  $('#back').onclick = () => { rv.view = 'home'; renderReview(); };
  $('#opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) answer(+b.dataset.i); });
  if ($('#replay')) $('#replay').onclick = () => speak(it.ko);
  if (q.mode === 'listen') setTimeout(() => speak(it.ko), 250);
  q.answered = false;
}
function answer(i) {
  const q = prac.quiz; if (q.answered) return;
  q.answered = true;
  const it = q.items[q.i], pick = q.opts[i], right = pick === it;
  const st = store.get('stats', { n: 0, ok: 0 }); st.n++; if (right) st.ok++; store.set('stats', st);
  if (right) q.score++; else q.wrong.push(it);
  adRec('quiz', right);
  $$('.opt').forEach((b, k) => { b.disabled = true; if (q.opts[k] === it) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
  const last = q.i === q.items.length - 1;
  $('#fb').innerHTML = `<div class="feedback ${right ? 'ok' : 'no'}">
    <span><b>${right ? '¡Correcto!' : 'Casi.'}</b> <span class="fk"><span lang="ko">${esc(it.ko)}</span> · <span style="color:var(--rom)">${esc(it.rom)}</span> · ${esc(it.es)}</span></span>

}
