  { id: 'cvs', t: 'La tienda que nunca cierra', ko: '편의점', rom: 'pyeonuijeom', es: 'tienda de conveniencia', txt: 'Muchas tiendas de conveniencia abren las 24 horas. Venden comida preparada, ramen que puedes cocinar allí mismo con agua caliente y bebidas, y algunas ofrecen servicio de paquetería.', tip: 'Es un buen lugar para practicar precios y pedir con 이거 주세요.' },
  { id: 'cafe', t: 'Cafés para todo', ko: '카페', rom: 'kape', es: 'cafetería', txt: 'Hay cafeterías por todas partes y se usan para reunirse, estudiar o trabajar. Hay una expresión humorística, 얼죽아, que viene de “café americano helado aunque me congele”: en pleno invierno también se pide helado.', tip: '아이스 아메리카노 주세요 sirve casi siempre.' },
  { id: 'tmoney', t: 'Una sola tarjeta para el transporte', ko: '티머니', rom: 'timeoni', es: 'tarjeta de transporte', txt: 'Las tarjetas recargables como T-money sirven para metro y autobús, y en muchas tiendas de conveniencia se compran y recargan. En el autobús se toca la tarjeta al subir y al bajar.', tip: 'Tenla a la mano antes de llegar al torniquete.' },
  { id: 'tips', t: 'Sin propina', ko: '팁', rom: 'tip', es: 'propina', txt: 'No es costumbre dejar propina en restaurantes, taxis ni cafés. El servicio ya está incluido en el precio.', tip: 'Si dejas dinero, es posible que te lo devuelvan.' },
  { id: 'ondol', t: 'El suelo que calienta', ko: '온돌', rom: 'ondol', es: 'calefacción por el suelo', txt: 'Es un sistema tradicional de calefacción bajo el piso. Por eso la vida en casa ocurre a nivel del suelo: se come, se descansa y se duerme sobre mantas o colchonetas, con los zapatos fuera.', tip: 'Ahora casi todas las casas usan una versión con agua caliente.' },
  { id: 'jjimjilbang', t: 'El spa público', ko: '찜질방', rom: 'jjimjilbang', es: 'spa con saunas', txt: 'Son baños públicos con saunas y salas de calor donde muchas personas pasan horas o incluso la noche. Las zonas de baño están separadas por género y se entra sin ropa, mientras que las salas comunes se usan con ropa que dan a la entrada.', tip: 'Ve con calma y con tiempo.' },
  { id: 'delivery', t: 'Casi todo llega a domicilio', ko: '배달', rom: 'baedal', es: 'entrega a domicilio', txt: 'El reparto de comida es muy rápido y está muy extendido: casi cualquier restaurante entrega, y también hay repartidores para cafés y tiendas.', tip: 'La palabra clave que verás es 배달.' },
  { id: 'nunchi', t: 'Leer el ambiente', ko: '눈치', rom: 'nunchi', es: 'tacto social', txt: 'Es la habilidad de captar cómo se siente el grupo sin que nadie lo diga. Se valora mucho tener 눈치 y se nota cuando falta.', tip: 'En el coreano, callar a tiempo también comunica.' },
  { id: 'uri', t: '“Nuestro” en lugar de “mi”', ko: '우리', rom: 'uri', es: 'nosotros / nuestro', txt: 'Es normal decir 우리 엄마 (“nuestra mamá”) o 우리 집 (“nuestra casa”) para hablar de tu propia mamá o casa. Refleja la idea de pertenencia a un grupo.', tip: 'Si te oyes decir 우리, vas muy bien.' },
  { id: 'sagye', t: 'Cuatro estaciones bien marcadas', ko: '사계절', rom: 'sagyejeol', es: 'cuatro estaciones', txt: 'Corea tiene primavera, verano, otoño e invierno bien diferenciados: cerezos en flor en primavera, un verano caluroso y húmedo con una temporada de lluvias, hojas rojas y amarillas en otoño, e invierno frío y seco, con nieve en muchas zonas. Mucha gente organiza paseos y comidas alrededor de cada estación.', tip: 'Las cuatro son 봄, 여름, 가을 y 겨울: las verás en menús y ofertas de temporada.' },
  { id: 'jangma', t: 'La temporada de lluvias', ko: '장마', rom: 'jangma', es: 'temporada de lluvias', txt: 'A partir de finales de junio suele empezar el 장마, unas semanas de lluvia y humedad que pueden extenderse hasta finales de julio. En esos días es normal salir con paraguas y a muchas personas se les antoja el pajeon, una tortita salada, mientras llueve.', tip: 'Con 비가 와요 ya puedes comentar el clima de esos días.' },
  { id: 'dust', t: 'El pronóstico también mide el aire', ko: '미세먼지', rom: 'mise-meonji', es: 'partículas finas', txt: 'Además de la temperatura, el pronóstico coreano suele informar el nivel de 미세먼지 (partículas finas en el aire), sobre todo en primavera. Mucha gente lo consulta en una app y, si está alto, usa mascarilla y evita hacer ejercicio afuera.', tip: 'Si lees 미세먼지 나쁨, significa que la calidad del aire está mala.' },
  { id: 'hanyak', t: 'Medicina tradicional coreana', ko: '한의원', rom: 'hanuiwon', es: 'clínica de medicina tradicional', txt: 'Además de los hospitales (병원), en Corea hay clínicas de medicina tradicional (한의원) que usan hierbas medicinales (한약) y acupuntura. En Daegu, el mercado de hierbas Yangnyeongsi funciona desde hace más de trescientos años.', tip: '약 es «medicina»: 한약 es la medicina de hierbas y 약국 la farmacia.' },

];
const capAt = k => Math.max(1, Math.round(k * CUR.length / CAPS.length) + 1);   // lección que abre la cápsula k
const capsOpen = () => CAPS.filter((c, k) => home.lessons >= capAt(k));
const capsNew = () => capsOpen().filter(c => !home.caps[c.id]);
function capItemHTML(c, open) {
  return `<div class="cap${open ? ' open' : ''}${home.caps[c.id] ? ' read' : ''}"><button class="cap-h" data-cap="${c.id}" aria-expanded="${open}"><span class="ko" lang="ko">${esc(c.ko)}</span><span><b>${esc(c.t)}</b><small>${esc(c.rom)} · ${esc(c.es)}</small></span>${home.caps[c.id] ? '' : '<span class="tag-c">nueva</span>'}</button>
    ${open ? `<div class="cap-b"><p>${esc(c.txt)}</p><p class="hint"><b>Para usar:</b> ${esc(c.tip)}</p></div>` : ''}</div>`;
}
function capCardHTML() {                                          // tarjeta de Inicio con la cápsula nueva más reciente
  const n = capsNew(), shown = hv.cap && capsOpen().find(x => x.id === hv.cap);   // sigue visible mientras está abierta
  if (!n.length && !shown) return '';
  const c = shown || n[n.length - 1];
  return `<div class="box capcard"><span class="tag">Cápsula cultural nueva</span>${capItemHTML(c, hv.cap === c.id)}</div>`;
}
function capsLibHTML() {
  const open = capsOpen(), next = CAPS.findIndex((c, k) => home.lessons < capAt(k));
  return `<div class="box"><h3>Cápsulas culturales <span class="ko-s">문화</span> <small style="color:var(--muted);font-weight:400">${Object.keys(home.caps).length} leídas de ${CAPS.length}</small></h3>
    <p class="lede">Cultura en pequeñas dosis, una nueva cada pocas lecciones. ${next >= 0 ? `La siguiente se abre con la lección ${capAt(next)}.` : 'Ya abriste todas.'}</p>
    ${open.length ? open.slice().reverse().map(c => capItemHTML(c, hv.cap === c.id)).join('') : '<p class="hint">Completa tu primera lección para abrir la primera.</p>'}</div>`;
}
hEl.addEventListener('click', e => {
  const b = e.target.closest('[data-cap]'); if (!b || hv.view !== 'dash') return;
  const id = b.dataset.cap; hv.cap = hv.cap === id ? null : id;
  if (hv.cap && !home.caps[id]) { home.caps[id] = todayKey(); home.stats.caps++; addXP(5); saveHome(); checkAch(); }
  const y = window.scrollY; renderHome(); window.scrollTo(0, y);
});

/* ================= Diario: calendario de constancia y resumen mensual =================
   Ver el progreso propio (días cumplidos, XP, lo que retuviste) refuerza la sensación de avance. Los días de descanso no cuentan como faltas. */
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const dm = { ym: null };                                         // mes mostrado "AAAA-MM"
const ymOf = k => k.slice(0, 7);
const ymShift = (ym, n) => { const [y, m] = ym.split('-').map(Number), d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' de ' + y; };
const monthDays = ym => { const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => ym + '-' + pad2(i + 1)); };
const firstActiveKey = () => Object.keys(home.done).concat(Object.keys(home.xpd)).sort()[0] || todayKey();
const isCounted = k => home.done[k] && home.done[k] !== 'shield';

function monthStats(ym) {
  const t = todayKey(), first = firstActiveKey(), days = monthDays(ym).filter(k => k <= t);
  const open = days.filter(k => !isRestKey(k) && k >= first), done = open.filter(isCounted), shields = open.filter(k => home.done[k] === 'shield');
  let best = 0, run = 0; open.forEach(k => { if (home.done[k]) { run++; best = Math.max(best, run); } else run = 0; });
  let n = 0, ok = 0, xp = 0, act = 0;
  days.forEach(k => { const l = srsLog[k]; if (l) { n += l.n; ok += l.ok; } const x = home.xpd[k] || 0; xp += x; if (x > 0) act++; });
  const lessons = days.filter(k => typeof home.done[k] === 'number').length;
  return { open: open.length, done: done.length, shields: shields.length, best, n, ok, xp, act, lessons };
}
function calendarHTML(ym) {
  const days = monthDays(ym), t = todayKey(), first = firstActiveKey(), off = (keyToDate(days[0]).getDay() + 6) % 7;
  const xps = days.map(k => home.xpd[k] || 0), mx = Math.max(1, ...xps);
  const cell = (k, i) => {
    const d = home.done[k], x = xps[i], fut = k > t, rest = isRestKey(k), lvl = x ? 1 + Math.min(3, Math.floor(x / mx * 3.999)) : 0;
    const cls = d === 'shield' ? 'sh' : d ? 'ok l' + Math.max(1, lvl) : rest ? 'rest' : fut ? 'fut' : k < first ? 'pre' : x ? 'part l' + lvl : 'miss';
    const tip = `${+k.slice(8)} de ${MONTHS[+k.slice(5, 7) - 1]}: ${d === 'shield' ? 'día protegido por un escudo' : d ? 'día cumplido' : rest ? 'descanso' : fut ? '' : x ? 'estudiaste algo' : 'sin estudio'}${x ? ' · ' + x + ' XP' : ''}`;
    return `<div class="cd ${cls}${k === t ? ' today' : ''}" title="${esc(tip)}" aria-label="${esc(tip)}"><span>${+k.slice(8)}</span>${d === 'shield' ? `<i>${ICON.shield}</i>` : ''}</div>`;
  };
  return `<div class="cal"><div class="cal-h">${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map(d => `<small>${d}</small>`).join('')}</div>
    <div class="cal-g">${'<div class="cd blank"></div>'.repeat(off)}${days.map(cell).join('')}</div>
    <div class="cal-leg"><span><i class="cd ok l1"></i>menos XP</span><span><i class="cd ok l4"></i>más XP</span><span><i class="cd sh"></i>escudo</span><span><i class="cd rest"></i>descanso</span></div></div>`;
}
function diaryHTML() {
  const cur = ymOf(todayKey()); if (!dm.ym) dm.ym = cur;
  const s = monthStats(dm.ym), p = monthStats(ymShift(dm.ym, -1)), isCur = dm.ym === cur, rate = s.n ? Math.round(s.ok / s.n * 100) : null;
  const dl = (a, b, unit) => b === 0 ? '' : a === b ? 'igual que el mes anterior' : (a > b ? '+' : '') + (a - b) + ' ' + unit + ' vs. mes anterior';
  const stat = (v, l, sub) => `<div><b>${v}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
  const first = firstActiveKey(), noData = !s.act && !s.done && dm.ym < ymOf(first);
  return `<div class="box"><div class="cal-top"><button class="btn ghost sm" data-dm="-1" aria-label="Mes anterior">←</button><h3 style="margin:0">${esc(ymLabel(dm.ym))}</h3>
      <button class="btn ghost sm" data-dm="1" aria-label="Mes siguiente" ${isCur ? 'disabled' : ''}>→</button></div>
    ${calendarHTML(dm.ym)}
    <p class="hint" style="margin-top:8px">Domingo y lunes son de misiones de fin de semana: no cuentan como faltas. Un día perdido no borra lo que ya construiste.</p></div>
    <div class="box"><h3>Resumen del mes <span class="ko-s">월간</span></h3>
    ${noData ? '<p class="lede">No hay datos de este mes: todavía no habías empezado.</p>' : `<div class="stat-grid">
      ${stat(`${s.done} de ${s.open}`, 'días de estudio cumplidos', s.shields ? `${s.shields} protegido${s.shields === 1 ? '' : 's'} por escudo` : dl(s.done, p.done, 'días'))}
      ${stat(s.xp, 'XP ganados', dl(s.xp, p.xp, 'XP'))}
      ${stat(s.lessons, 'lecciones nuevas', '')}
      ${stat(s.n, 'tarjetas respondidas', rate == null ? '' : rate + ' % de aciertos')}
      ${stat(s.best, 'racha más larga del mes', '')}
      ${stat(s.act, 'días con actividad', '')}</div>`}
    <div class="row" style="margin-top:12px"><button class="btn" data-mcard ${noData ? 'disabled' : ''}>${ICON.share} Tarjeta del mes</button></div></div>
    ${typeof seasonsListHTML === 'function' ? seasonsListHTML() : ''}${typeof capsLibHTML === 'function' ? capsLibHTML() : ''}`;
}
async function monthCard() {
  const s = monthStats(dm.ym), lv = levelOf(home.xp), rate = s.n ? Math.round(s.ok / s.n * 100) : null;
  const blocks = [
    { t: 'Mi mes de coreano', size: 34, color: '--muted', gap: 30 },
    { t: ymLabel(dm.ym), size: 60, weight: 500, gap: 50 },
    { t: `${s.done} de ${s.open}`, size: 170, weight: 500, color: '--accent', gap: 4 },
    { t: 'días de estudio cumplidos', size: 40, color: '--muted', gap: 56 },
    { t: `${s.xp} XP · ${s.lessons} lecciones nuevas`, size: 46, gap: 14 },
    { t: `${s.n} tarjetas respondidas${rate == null ? '' : ' · ' + rate + ' % de aciertos'}`, size: 38, color: '--muted', gap: 14, lines: 2 },
    { t: `Racha más larga del mes: ${s.best} · Nivel ${lv}`, size: 38, color: '--muted', gap: 14, lines: 2 }
  ];
  const blob = await cardPNG(blocks, 'Aprendiendo coreano · ' + ymLabel(dm.ym));
  if (blob) shareBlob(blob, 'mi-mes-coreano-' + dm.ym + '.png', 'Mi mes de coreano: ' + s.done + ' de ' + s.open + ' días de estudio.');
}
hEl.addEventListener('click', e => {
  if (hv.view !== 'dash' || hv.sub !== 'diario') return;
  const b = e.target.closest('[data-dm]'); if (b && !b.disabled) { dm.ym = ymShift(dm.ym || ymOf(todayKey()), +b.dataset.dm); renderHome(); return; }
  if (e.target.closest('[data-mcard]')) monthCard();

/* ================= Radar de habilidades y Álbum de colecciones =================
   El radar muestra seis habilidades con su propio nivel, calculado con tus aciertos en clase, Repaso, ejercicios y juegos.
   El álbum guarda de forma permanente cada palabra que llegó a Árbol en el jardín; al completar un tema ganas un sello. */

/* --- Radar --- */
const SKILLS = [
  { id: 'lec', ko: '읽기', es: 'Lectura', hint: 'Repasar tarjetas, hacer las lecciones y leer textos reales lo entrena.', go: () => showTab('review'), goTxt: 'Ir a Repaso' },
  { id: 'oid', ko: '듣기', es: 'Oído', hint: 'Oído coreano, el Bingo de escucha y la Caja registradora lo entrenan.', go: () => { showTab('learn'); showSub('ear'); }, goTxt: 'Practicar Oído' },
  { id: 'esc', ko: '쓰기', es: 'Escritura', hint: 'Escribir las palabras en las lecciones, la Mecanografía y el Wordle lo entrenan.', go: () => { showTab('games'); gmOpen('tipeo'); }, goTxt: 'Jugar Mecanografía' },
  { id: 'cor', ko: '존댓말', es: 'Cortesía', hint: 'Las Situaciones de cortesía y el Semáforo lo entrenan.', go: () => { showTab('learn'); showSub('levels'); }, goTxt: 'Practicar Cortesía' },
  { id: 'con', ko: '활용', es: 'Conjugación', hint: 'El modo Conjugar lo entrena.', go: () => { showTab('learn'); showSub('levels'); }, goTxt: 'Practicar Conjugar' },
  { id: 'gra', ko: '문법', es: 'Gramática', hint: 'Los patrones de Gramática, Ordena la frase y el Detective de partículas lo entrenan.', go: () => { showTab('learn'); showSub('gram'); }, goTxt: 'Ir a Gramática' }
];
const SK_LV = [0, 12, 35, 75, 140, 230, 350, 510, 720, 1000];      // aciertos acumulados para llegar a cada nivel (1 a 10)
const skLv = n => { let l = 1; SK_LV.forEach((t, i) => { if (i && n >= t) l = i + 1; }); return l; };
function skData() {                                              // se siembra la primera vez con un cálculo aproximado de lo que ya hiciste
  if (!home.skill) {
    const st = home.stats, z = () => ({ ok: 0, n: 0, r: '' }), d = { seed: 1 };
    SKILLS.forEach(s => { d[s.id] = z(); });
    d.lec.ok = learnedWords() + Math.floor(st.reviews * 0.6) + st.reads * 4; d.oid.ok = st.ear * 10; d.esc.ok = home.lessons * 4;
    d.cor.ok = st.sit * 10; d.con.ok = st.conj * 10; d.gra.ok = st.gram * 12;
    SKILLS.forEach(s => { d[s.id].n = d[s.id].ok; });
    home.skill = d; saveHome();
  }
  return home.skill;
}
function skill(axis, ok) {                                       // registra un acierto o un fallo en una habilidad
  const d = skData(), a = d[axis]; if (!a) return;
  const before = skLv(a.ok);
  a.n++; if (ok) a.ok++; a.r = (a.r + (ok ? '1' : '0')).slice(-40);
  saveHome();
  const after = skLv(a.ok);
  if (after > before) { toast(`Radar: ${SKILLS.find(s => s.id === axis).es} sube al nivel ${after}.`); checkAch(); }
}
const skAcc = a => a.r.length >= 5 ? Math.round([...a.r].filter(x => x === '1').length / a.r.length * 100) : null;
function radarHTML() {
  const d = skData(), n = SKILLS.length, CX = 150, CY = 122, R = 84;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n, pt = (i, f) => [CX + Math.cos(ang(i)) * R * f, CY + Math.sin(ang(i)) * R * f];
  const P = a => a.map(v => v.toFixed(1)).join(',');
  const lv = SKILLS.map(s => skLv(d[s.id].ok));
  const rings = [0.2, 0.4, 0.6, 0.8, 1].map(f => `<polygon class="rr" points="${SKILLS.map((_, i) => P(pt(i, f))).join(' ')}"/>`).join('');
  const spokes = SKILLS.map((_, i) => { const p = pt(i, 1); return `<line class="rs" x1="${CX}" y1="${CY}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`; }).join('');
  const poly = `<polygon class="rp" points="${lv.map((l, i) => P(pt(i, l / 10))).join(' ')}"/>${lv.map((l, i) => { const p = pt(i, l / 10); return `<circle class="rd" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4"/>`; }).join('')}`;
  const labels = SKILLS.map((s, i) => {
    const p = pt(i, 1.24), a = Math.cos(ang(i)), anc = Math.abs(a) < 0.3 ? 'middle' : a > 0 ? 'start' : 'end', dy = Math.sin(ang(i)) > 0.5 ? 14 : Math.sin(ang(i)) < -0.5 ? -8 : 2;
    return `<text class="rdl" x="${p[0].toFixed(1)}" y="${(p[1] + dy).toFixed(1)}" text-anchor="${anc}"><tspan lang="ko" class="rdlk">${s.ko}</tspan> <tspan class="rdls">${s.es}</tspan></text>`;
  }).join('');
  const rows = SKILLS.map((s, i) => {
    const a = d[s.id], l = lv[i], lo = SK_LV[l - 1], hi = SK_LV[l], pct = l >= 10 ? 100 : Math.round((a.ok - lo) / (hi - lo) * 100), acc = skAcc(a);
    return `<div class="skrow"><b lang="ko">${s.ko}</b><span>${s.es}</span><div class="bar"><i style="width:${pct}%"></i></div><small>Nv ${l}${acc == null ? '' : ' · ' + acc + ' %'}</small></div>`;
  }).join('');
  const weak = SKILLS.map((s, i) => ({ s, l: lv[i], a: skAcc(d[s.id].r ? d[s.id] : { r: '' }), n: d[s.id].n })).sort((x, y) => x.l - y.l || (x.a == null ? 101 : x.a) - (y.a == null ? 101 : y.a) || x.n - y.n)[0];
  const total = SKILLS.reduce((t, s) => t + d[s.id].n, 0);
  const tip = total < 10 ? '<p class="hint">Tu radar se va llenando con lo que haces: lecciones, Repaso, ejercicios y juegos.</p>'
    : `<div class="sktip"><span><b>${weak.s.es}</b> es tu habilidad más floja ahora (nivel ${weak.l}). ${esc(weak.s.hint)}</span><button class="btn sm" data-skgo="${weak.s.id}">${esc(weak.s.goTxt)}</button></div>`;
  const alt = SKILLS.map((s, i) => `${s.es} nivel ${lv[i]}`).join(', ');
  return `<div class="box radar"><h3>Radar de habilidades <span class="ko-s">능력치</span></h3>
    <p class="lede">Seis habilidades, cada una con su propio nivel. Los puntos suben con tus aciertos; la forma te dice dónde conviene practicar.</p>
    <div class="radar-in"><svg viewBox="-45 0 390 250" role="img" aria-label="Radar de habilidades: ${esc(alt)}">${rings}${spokes}${poly}${labels}</svg><div class="skrows">${rows}</div></div>${tip}
    ${d.seed ? '<p class="hint">Las sesiones anteriores a esta función se contaron de forma aproximada.</p>' : ''}</div>`;
}
hEl.addEventListener('click', e => { const b = e.target.closest('[data-skgo]'); if (!b) return; const s = SKILLS.find(x => x.id === b.dataset.skgo); if (s) { hv.view = 'dash'; hv.sum = null; s.go(); } });

/* --- Álbum de colecciones --- */
const ALB_MIN = 4;                                               // etapa del jardín que cuenta como dominada: Árbol
const ALB_SEAL = { saludos: '안', personas: '친', sino: '일', nativos: '하', comida: '밥', lugares: '길', preguntas: '뭐', verbos: '해', adjetivos: '좋', tiempo: '때', lugares2: '집', cosas: '돈', verbos2: '동', adverbios: '더', adjetivos2: '늦', cuerpo: '몸', salud: '약', clima: '바', estaciones: '겨', sentir: '슬', verbos3: '씻', adverbios2: '항', medico: '병', hoyclima: '눈', sentirse: '힘', presentarte: '나', ayuda: '도', restaurante: '맛', compras: '값', transporte: '역', diario: '날' };
let albCache = null;
function albTopics() {
  if (!albCache) albCache = DATA.vocab.map(c => ({ id: c.id, ko: c.ko, es: c.es, kind: 'v' })).concat(DATA.phrases.map(c => ({ id: c.id, ko: c.ko, es: c.es, kind: 'p' })))
    .map(t => Object.assign(t, { ids: (t.kind === 'v' ? VOCAB : PHRASES).filter(w => w.cat === t.id).map(refIdOf) }));
  return albCache;
}
function albumSync() {
  const a = home.album || (home.album = { w: {}, t: {} }); a.w = a.w || {}; a.t = a.t || {};
  let ch = false; const now = Date.now(), tk = todayKey();
  [...unlockedRefs(home.lessons)].forEach(id => { if (a.w[id] || !BYKO.get(id)) return; const p = plantOf(id, now); if (p && p.st >= ALB_MIN) { a.w[id] = tk; ch = true; } });
  const got = [];
  albTopics().forEach(t => { if (a.t[t.id] || !t.ids.length) return; if (t.ids.every(id => a.w[id])) { a.t[t.id] = tk; home.inv.av[ALB_SEAL[t.id]] = 1; got.push(t); ch = true; } });
  if (ch) saveHome();
  if (got.length) { toast('Álbum completo: ' + got.map(t => t.es).join(', ') + '. Ganaste un sello.'); celebrate(); }
}
const ab = { open: null };
function albumHTML() {
  albumSync();
  const a = home.album, T = albTopics(), total = T.reduce((n, t) => n + t.ids.length, 0), have = Object.keys(a.w).length, done = Object.keys(a.t).length, now = Date.now(), unl = unlockedRefs(home.lessons);
  const card = t => {
    const k = t.ids.filter(id => a.w[id]).length, full = !!a.t[t.id];
    return `<button class="alb${full ? ' full' : ''}${ab.open === t.id ? ' open' : ''}" data-alb="${t.id}" aria-expanded="${ab.open === t.id}"><span class="seal${full ? '' : ' off'}" lang="ko">${ALB_SEAL[t.id]}</span><b>${esc(t.es)}</b><small>${k} / ${t.ids.length}</small><span class="bar"><i style="width:${k / t.ids.length * 100}%"></i></span></button>`;
  };
  const open = ab.open && T.find(t => t.id === ab.open);

    const slots = open.ids.map(id => {
      const it = BYKO.get(id);
      if (a.w[id]) return `<button class="aw got" data-say="${esc(it.ko)}" title="${esc(it.es)}"><span class="ko" lang="ko">${esc(it.ko)}</span><small>${esc(it.es)}</small></button>`;
      const p = unl.has(id) ? plantOf(id, now) : null;
      if (p) return `<div class="aw grow" title="${esc(it.ko)} · ${PLANT[p.st].name}"><span class="pl s${p.st}">${plantSVG(p.st)}</span><small>${PLANT[p.st].name}</small></div>`;
      if (unl.has(id)) return `<div class="aw grow" title="${esc(it.ko)}"><span class="pl s0">${plantSVG(0)}</span><small>Semilla</small></div>`;
      return '<div class="aw lock" aria-label="Aún sin descubrir"><span>?</span></div>';
    }).join('');
    const seal = ALB_SEAL[open.id], full = !!a.t[open.id];
    detail = `<div class="albdet"><h4 class="mini-h" style="margin-top:0">${esc(open.es)} <span lang="ko">${esc(open.ko)}</span></h4><div class="albwords">${slots}</div>
      <p class="hint" style="margin-top:8px">${full ? `Tema completo. Sello <b lang="ko">${seal}</b> ganado.` : `Completa las ${open.ids.length} palabras del tema para ganar el sello <b lang="ko">${seal}</b>.`}</p>
      ${full ? `<button class="btn sm ${home.av === seal ? '' : 'acc'}" data-alu="${seal}">${home.av === seal ? 'Quitar sello' : 'Usar sello'}</button>` : ''}</div>`;
  }
  return `<div class="box"><h3>Álbum de colecciones <span class="ko-s">도감</span></h3>
    <p class="lede">Cuando una palabra llega a Árbol en tu jardín (repaso a 2 meses o más), entra al álbum y se queda: aunque después se te olvide un poco, sigue siendo un logro tuyo. Al completar un tema ganas un sello para tu perfil.</p>
    <div class="row" style="margin-bottom:10px;gap:14px"><span class="hint" style="margin:0"><b>${have}</b> de ${total} palabras en el álbum</span><span class="hint" style="margin:0"><b>${done}</b> de ${T.length} temas completos</span></div>
    <div class="albgrid">${T.map(card).join('')}</div>${detail}</div>`;
}

    ['Notar antes de que te lo expliquen', 'En Gramática primero ves ejemplos con la parte clave resaltada y adivinas la regla; después se te explica. La hipótesis de la atención (noticing) sostiene que notar una forma en ejemplos ayuda a adquirirla.', 'Schmidt (1990)'],
    ['Reglas explícitas y práctica', 'Los metaanálisis sobre enseñanza de gramática encuentran que explicar la regla y luego practicarla suele funcionar mejor que solo estar expuesto al idioma, sobre todo en adultos. Por eso cada patrón termina con ejercicios de completar y ordenar.', 'Norris y Ortega (2000) · Spada y Tomita (2010)'],
    ['Jugar para practicar, con límites', 'Los juegos añaden variedad y una razón para practicar, y los metaanálisis sobre gamificación encuentran efectos de pequeños a medianos, que dependen mucho del diseño. Por eso aquí dan la mitad de XP, tienen tope diario, no tocan la racha ni cambian los intervalos del Repaso: responder con prisa no debe distorsionar tu memoria real.', 'Sailer y Homner (2020) · Hamari, Koivisto y Sarsa (2014)'],
    ['Ver dónde estás fuerte y dónde débil', 'El radar separa la lectura, el oído, la escritura, la cortesía, la conjugación y la gramática. Saber en qué habilidad fallas más ayuda a decidir qué practicar; monitorear el propio aprendizaje es parte del aprendizaje autorregulado.', 'Zimmerman (2002)'],
    ['Cultura y fechas reales', 'Las temporadas y las cápsulas conectan el idioma con fiestas y costumbres reales. El interés por la cultura de la lengua meta se asocia con más motivación para aprenderla, aunque el efecto varía mucho entre personas.', 'Gardner (1985) · Dörnyei (2009)'],
    ['Medir lo que se queda', 'Sentir que “ya lo sé” engaña. Por eso el panel muestra la retención real de tus repasos, no solo puntos.', 'Koriat y Bjork (2005)']
  ];
  return `<details class="guide"><summary>La ciencia detrás de cada lección</summary><div class="guide-body sci">
    ${rows.map(r => `<div class="sci-row"><b>${r[0]}</b><p>${r[1]}</p><small>${r[2]}</small></div>`).join('')}
    <p class="full" style="margin-top:6px">Ninguna técnica garantiza resultados, y la mayoría de estos estudios son de laboratorio o con otros idiomas. Cinco palabras al día es la carga que pediste y resulta fácil de sostener; no es una cifra con respaldo especial en la investigación. Lo que más pesa es volver seguido: por eso lo demás está pensado para que no te cueste hacerlo.</p></div></details>`;
}

function slidePill(seg, prev) {                                 // la píldora de la sección activa se desliza desde la anterior
  if (!seg) return;
  const on = seg.querySelector('[aria-pressed="true"]'); if (!on) return;
  if (prev) seg.scrollLeft = prev.sl;
  const to = { x: on.offsetLeft, w: on.offsetWidth };
  const center = () => seg.scrollTo({ left: Math.max(0, to.x - (seg.clientWidth - to.w) / 2), behavior: reduceMotion() ? 'auto' : 'smooth' });
  if (reduceMotion() || !prev) { if (seg.scrollWidth > seg.clientWidth && !prev) seg.scrollLeft = Math.max(0, to.x - (seg.clientWidth - to.w) / 2); return; }
  const pill = document.createElement('span'); pill.className = 'segpill'; pill.setAttribute('aria-hidden', 'true');
  pill.style.width = prev.w + 'px'; pill.style.transform = 'translateX(' + prev.x + 'px)';
  seg.prepend(pill); seg.classList.add('hasPill');
  requestAnimationFrame(() => requestAnimationFrame(() => { pill.style.width = to.w + 'px'; pill.style.transform = 'translateX(' + to.x + 'px)'; center(); }));
}
function renderDash() {
  const sub = SUBNAV.some(x => x[0] === hv.sub) ? hv.sub : 'today', h = SUB_HEAD[sub];

  enterOnce(hEl, 'dash:' + sub); slidePill(hEl.querySelector('.subnav'), prevPill);
  const st = $('#hmStart'); if (st) st.onclick = startLesson;
  const rs = $('#hmReset'); if (rs) rs.onclick = () => {
    if (!confirm('¿Reiniciar lecciones, XP, racha y logros de Inicio? Las tarjetas del Repaso, tus monedas, tus compras, el álbum, los sellos, el radar y los récords de juegos no se borran. Antes se guardará una copia en Repaso › Respaldo.')) return;

    ['xp', 'lessons'].forEach(k => home[k] = 0); home.done = {}; home.ach = {}; home.chest = {}; home.restSeen = {}; home.run = null;
    home.streak = { count: 0, best: 0, last: null, checked: todayKey(), shields: 0, lost: null };
    home.stats = Object.assign({}, STAT0, { earned: home.stats.earned, spent: home.stats.spent }); home.bonus = {};
    home.swaps = []; home.bosses = {}; home.diag = []; home.reads = {}; home.caps = {}; home.xpd = {}; home.conf = {}; home.qw = null; home.wm = null; home.seenStage = {}; home.extra = {}; home.teach = {}; home.gram = {};
    saveHome(); updateBadge(); updateHomeDot(); hv.peek = null; hv.sub = 'today'; hv.cap = null; hv.read = null; renderDash();
  };
}
/* --- Novedades de contenido (una vez por bloque nuevo, solo a quien ya venía estudiando) --- */
function newsCardHTML() {

    : `<b>Cuerpo, salud y clima.</b> Llegan ${w3} palabras nuevas al final de tus lecciones actuales (partes del cuerpo, el médico y la farmacia, el clima y las estaciones), frases para el médico y la charla del tiempo, dos diálogos nuevos, ${gNew} patrones de gramática (-네요, -(으)ㄹ 것 같아요, -(으)ㄹ 때…) que se abren poco a poco, siete habitaciones en el palacio, sellos en el álbum y una etapa nueva del viaje. Tu progreso sigue exactamente igual.`;
  return `<div class="box bkcard newscard"><span class="tag">Novedades · bloque ${cv < 2 ? '1 y 2' : '2'}</span>

document.addEventListener('click', e => {

function goSub(k) { hv.view = 'dash'; hv.sum = null; hv.sub = k; hv.read = null; hv.cap = null; renderHome(); window.scrollTo(0, 0); }
hEl.addEventListener('click', e => {

});

/* --- Resumen de la lección --- */
function renderDone() {
  if (hv.sum.mode) return renderSpecialDone(hv.sum);
  const S = hv.sum, L = CUR[S.idx], q = queue(Date.now()), due = q.learnDue.length + q.learnAhead.length + q.rev.length;
  const nextK = nextOpenKey(todayKey()), nd = WDAYS[wdayOf(nextK)];

    <span class="tag">Lección ${S.idx + 1} completa</span>
    <h2 style="font-size:26px;font-weight:500;margin:4px 0 2px" lang="ko">${msg.split(' ')[0]}</h2><p class="rom always" style="margin-bottom:12px">${esc(msg.split(' ').slice(1).join(' '))}</p>
    <div class="xp-big">+${S.xp} XP</div>
    <div class="xp-break"><span>Lección +${S.bonus.base}</span>${S.bonus.perfect ? `<span>Sin errores +${S.bonus.perfect}</span>` : ''}<span>Racha +${S.bonus.streak}</span>${S.chest ? '<span>Cofre semanal +50 y un escudo</span>' : ''}${S.coins ? `<span>Monedas +${S.coins}</span>` : ''}</div>
    <div class="streak-big"><span class="fl">${ICON.flame}</span><b>${S.streak}</b> ${S.streak === 1 ? 'día' : 'días'} de racha${S.lvUp ? ` · <b>¡Subiste al nivel ${levelOf(home.xp)}!</b>` : ''}</div>
    ${S.ach.length ? `<div class="chipline" style="justify-content:center">${S.ach.map(a => `<span class="ach-new"><b lang="ko">${esc(a.ko)}</b> ${esc(a.name)}</span>`).join('')}</div>` : ''}
    ${S.oldN ? `<p class="hint" style="margin:6px 0 0">Recordaste <b>${S.oldOk} de ${S.oldN}</b> palabras de lecciones anteriores: eso es memoria real, no solo puntos.</p>` : ''}
    <h4 class="mini-h">Palabras de hoy</h4>
    <div class="dwords">${S.words.map(id => { const w = BYKO.get(id); return `<div class="r-row"><div><span class="ko" lang="ko" style="font-size:22px">${esc(w.ko)}</span> <span class="rom">${esc(w.rom)}</span><div class="es">${esc(w.es)}${S.missed.includes(id) ? ' <span class="tag-c">la repasaremos pronto</span>' : ''}</div></div><button class="icon" data-say="${esc(w.ko)}" aria-label="Escuchar">${ICON.speaker}</button></div>`; }).join('')}</div>
    <p class="hint">Ya están en tu Repaso${due ? ` (${due} tarjeta${due === 1 ? '' : 's'} pendientes)` : ''}: la primera vuelta llega en unos minutos, la siguiente mañana. Próxima lección: <b>${nd}</b>. Mientras tanto, descansar también es parte del método.</p>
    ${capsNew().length ? `<p class="hint">Hay una cápsula cultural nueva esperándote.</p>` : ''}
    ${gNext() ? `<p class="hint">Se abrió un patrón de gramática nuevo: <b lang="ko">${esc(gNext().ko)}</b> (opcional).</p>` : ''}
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn acc" data-go="review">Ir a Repaso</button>${capsNew().length ? '<button class="btn" data-go-sub="diario">Ver cápsula</button>' : ''}${gNext() ? `<button class="btn" data-gram="start:${gNext().id}">Ver patrón nuevo</button>` : ''}<button class="btn ghost" id="doneBack">Volver al inicio</button></div>
  </div></div>`;
  window.scrollTo(0, 0);

/* ================= PWA: service worker, actualización controlada y avisos del almacenamiento ================= */
function pwaBar(html, opts) {
  opts = opts || {}; let bar = $('#pwaBar'); if (bar) bar.remove();
  bar = document.createElement('div'); bar.id = 'pwaBar'; bar.className = 'pwabar' + (opts.warn ? ' warn' : ''); bar.setAttribute('role', 'status');
  bar.innerHTML = `<span>${html}</span>${(opts.btns || []).map((b, i) => `<button class="btn${b.ghost ? ' ghost' : ''}" data-pwab="${i}">${esc(b.t)}</button>`).join('')}`;
  bar.addEventListener('click', e => { const b = e.target.closest('[data-pwab]'); if (b) opts.btns[+b.dataset.pwab].f(); });
  document.body.appendChild(bar); return bar;
}
const pwaClose = () => { const b = $('#pwaBar'); if (b) b.remove(); };

/* avisos que deja el motor de almacenamiento al arrancar (recuperación, migración, versión más nueva…) */
KRS.notices().forEach(n => {
  if (n.t === 'frozen' || n.t === 'migfail') pwaBar(esc(n.msg), { warn: true });
  else setTimeout(() => toast(n.msg), 900);
});

/* service worker: solo en https/http y en la versión PWA (la que trae <meta name="kr-pwa">) */
if ('serviceWorker' in navigator && bkWeb && document.querySelector('meta[name="kr-pwa"]')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  const offer = w => pwaBar('<b>Hay una versión nueva de la app.</b> Tu progreso no se toca: se guarda una copia antes de actualizar.', {
    btns: [{ t: 'Actualizar', f: () => { pwaBar('Actualizando…'); KRS.flush().then(() => w.postMessage({ type: 'SKIP_WAITING' })); } }, { t: 'Más tarde', ghost: true, f: pwaClose }]
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    const chk = () => { try { reg.update().catch(() => {}); } catch (e) { /* sin red */ } };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') chk(); });
    setInterval(chk, 3600e3);
  }).catch(() => { /* sin service worker: la app funciona igual, solo sin modo sin conexión */ });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
}
