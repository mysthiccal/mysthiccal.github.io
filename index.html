const BK_WEEK = 7 * 864e5;
const bkIsIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const bkStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const bkWeb = /^https?:$/.test(location.protocol);
const bkWhen = t => { try { return new Date(t).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return new Date(t).toISOString().slice(0, 16).replace('T', ' '); } };
const bkAgo = t => { if (!t) return 'nunca'; const d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`; };
const bkKB = n => n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function exportPayload() {
  return { app: 'kr', v: 1, schema: KRS.SCHEMA, appVer: KRS.APP_VER, date: new Date().toISOString(), cards: srsCards, log: srsLog, cfg: srsCfg, mn: mnCustom, fav: [...fav], learned: [...learned], home, ear, sit, conj: cj, adapt: ad };
}
KRS.setExporter(exportPayload);
function exportData() {
  const name = 'coreano-progreso-' + dayKey(Date.now()) + '.json', blob = new Blob([JSON.stringify(exportPayload())], { type: 'application/json' });
  const done = () => { KRS.setMeta({ lastExport: Date.now() }); if (typeof renderReviewHome === 'function' && state.tab === 'review') bkBind(); if (state.tab === 'home' && typeof renderHome === 'function') renderHome(); };
  if (bkIsIOS && navigator.canShare && window.File) {                    // iPhone/iPad: la hoja de compartir permite «Guardar en Archivos»
    try {
      const f = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Respaldo de Coreano' }).then(done).catch(err => { if (err && err.name !== 'AbortError') bkDownload(blob, name, done); }); return; }
    } catch (e) { /* cae a la descarga normal */ }
  }
  bkDownload(blob, name, done);
}
function bkDownload(blob, name, done) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); done && done();
}

  const last = Math.max(m.lastExport || 0, m.lastFile || 0), ref = last || m.first || now;
  if (now - ref < BK_WEEK || (m.snooze && now < m.snooze)) return null;

document.addEventListener('click', e => {

/* ================= Dificultad adaptativa (Oído, Conjugar y Práctica libre) =================
   Objetivo: que aciertes cerca del 85 %: ni tan fácil que te aburras ni tan difícil que te frustres.
   Al terminar cada sesión, si acertaste 90 % o más sube un nivel; si acertaste 60 % o menos baja uno. Puedes fijar el nivel a mano. */
const AD_NAMES = ['', 'Base', 'Reto', 'Experto'];
const AD_MOD = { ear: 'Oído', conj: 'Conjugar', quiz: 'Práctica libre' };
const ad = Object.assign({}, store.get('adapt', {}));
Object.keys(AD_MOD).forEach(m => { ad[m] = Object.assign({ L: 2, auto: true }, ad[m] || {}); ad[m].sess = ad[m].sess || { n: 0, ok: 0 }; });
const saveAd = () => store.set('adapt', ad);
const adLevel = m => ad[m].L;
function adRec(m, ok) { const s = ad[m].sess; s.n++; if (ok) s.ok++; }
function adEnd(m) {                                              // llamar al terminar una sesión; devuelve un aviso o ''
  const a = ad[m], s = a.sess; a.sess = { n: 0, ok: 0 };
  if (!s.n) return '';
  const acc = s.ok / s.n; let msg = '';
  if (a.auto && s.n >= 6) {
    if (acc >= 0.9 && a.L < 3) { a.L++; msg = `Nivel ${AD_NAMES[a.L]}: acertaste ${Math.round(acc * 100)} %, así que subió la dificultad.`; }
    else if (acc <= 0.6 && a.L > 1) { a.L--; msg = `Nivel ${AD_NAMES[a.L]}: para que practiques con más calma, bajó un poco la dificultad.`; }
  }
  saveAd(); a.msg = msg; return msg;
}
function adUI(m) {                                               // selector Auto / 1 / 2 / 3 con el nivel actual
  const a = ad[m];
  const b = (v, txt) => `<button data-ad="${m}:${v}" aria-pressed="${v === 'auto' ? a.auto : (!a.auto && a.L === +v)}">${txt}</button>`;
  return `<div class="adapt"><span class="ad-l">Dificultad <b>${AD_NAMES[a.L]}</b></span>
    <div class="seg sm" role="group" aria-label="Dificultad de ${AD_MOD[m]}">${b('auto', 'Auto')}${b(1, 'Base')}${b(2, 'Reto')}${b(3, 'Experto')}</div>
    <small>${a.auto ? 'Se ajusta sola: sube con 90 % de aciertos y baja con 60 % o menos.' : 'Nivel fijo elegido por ti.'}</small>${a.msg ? `<small class="ad-msg">${esc(a.msg)}</small>` : ''}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ad]'); if (!b) return;
  const [m, v] = b.dataset.ad.split(':');
  if (v === 'auto') ad[m].auto = true; else { ad[m].auto = false; ad[m].L = +v; }
  ad[m].msg = ''; saveAd();

});

function palMove(d) {
  const n = roomWords(pal.room).length, j = pal.i + d;

}
plEl.addEventListener('click', e => {
  const t = e.target;
  const room = t.closest('[data-room]');
  if (room) { pal.room = room.dataset.room; pal.mode = 'list'; pal.i = 0; pal.shown = false; renderPalace(); return; }
  if (t.closest('#plBack')) { pal.room = null; renderPalace(); return; }
  const md = t.closest('[data-plmode]');
  if (md) { pal.mode = md.dataset.plmode; pal.i = 0; pal.shown = false; renderPalace(); return; }
  const sp = t.closest('[data-act="speak"]'); if (sp) { speak(sp.dataset.t); return; }
  const ed = t.closest('[data-act="editmn"]'); if (ed) { openMn(ed.closest('[data-k]').dataset.k, true); return; }
  if (t.closest('#plShow')) { pal.shown = true; renderPalace(); return; }
  if (t.closest('#plPrev')) { palMove(-1); return; }
  if (t.closest('#plNext')) { palMove(1); return; }
  if (t.closest('#plSay')) { speak(roomWords(pal.room)[pal.i].ko); }
});
document.addEventListener('keydown', e => {
  if (state.tab !== 'learn' || state.sub !== 'palace' || pal.room === null || pal.mode !== 'walk' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || dlg.open) return;
  if (e.key === 'ArrowRight') palMove(1);
  else if (e.key === 'ArrowLeft') palMove(-1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); if (!pal.shown) { pal.shown = true; renderPalace(); } }
});

function buildSit() {
  const scored = SCEN.map(s => { const t = sit.st[s.id]; return { s, w: t ? (t.n - t.ok) / t.n * 2 + Math.random() : 3 + Math.random() }; })
    .sort((a, b) => b.w - a.w).slice(0, 8).map(x => x.s);
  const list = [], pool = shuffle(scored);
  while (pool.length) {                                    // mezcla de niveles: evita dos seguidos iguales si se puede
    const last = list.length ? list[list.length - 1].lv : '';
    let k = pool.findIndex(x => x.lv !== last); if (k < 0) k = 0;
    const s = pool.splice(k, 1)[0];
    list.push({ id: s.id, lv: s.lv, key: s.key, type: Math.random() < 0.5 ? 'lv' : 'fm', es: s.es, why: s.why });
  }
  return { list, i: 0, ok: 0, res: null, pick: null, miss: [] };
}

  let n = 0, ok = 0; Object.values(sit.st).forEach(t => { n += t.n; ok += t.ok; });

/* ================= Cortesía · Conjugar (práctica intercalada) =================
   Cada pregunta cambia de verbo, de nivel y de tipo de ejercicio a propósito: mezclar en vez de repetir el mismo patrón
   se siente más difícil pero suele dar mejor retención a largo plazo (práctica intercalada). */
const CJI = LVL.filter(x => x.type === 'v' || x.type === 'a');

const RULE = {
  casual: 'Casual: quita el -요 de la forma cortés.',
  polite: 'Cortés: raíz + -아요 / -어요 / -해요.',

};
const lvChip = lv => `<span class="lvl lvl-${lv}">${KR_LEVELS.labels[lv].ko}</span>`;
const pickOne = a => a[Math.floor(Math.random() * a.length)];

function cjTask(prev) {
  const wt = it => { const t = cj.k[it.key]; return 1 + (t ? (t[0] - t[1]) / Math.max(1, t[0]) * 3 : 1.5); };
  const pool = CJI.filter(it => !prev || it.key !== prev.key);
  let r = Math.random() * pool.reduce((a, it) => a + wt(it), 0), it = pool[0];
  for (const c of pool) { r -= wt(c); if (r <= 0) { it = c; break; } }
  const lv = pickOne(LVORDER.filter(l => !prev || l !== prev.lv));
  const L = adLevel('conj'), allowed = L === 1 ? ['form', 'level'] : L === 2 ? CJ_TYPES : ['cvt', 'type', 'cvt', 'form'];   // Base: elegir · Reto: todo · Experto: más cambio de nivel y escribir
  const type = pickOne(allowed.filter(t => !prev || t !== prev.t));
  const other = pickOne(CJI.filter(x => x.key !== it.key && x.type === it.type));
  const sl = pickOne(LVORDER.filter(l => l !== lv));
  const t = { t: type, key: it.key, lv, sl, res: null };
  const tag = (i, l) => ({ k: i.key + ':' + l, ko: i.f[l][0], rom: i.f[l][1] });
  if (type === 'form') t.o = shuffle([tag(it, lv), ...LVORDER.filter(l => l !== lv).map(l => tag(it, l)), tag(other, lv)]);
  else if (type === 'cvt') t.o = shuffle([tag(it, lv), tag(it, LVORDER.find(l => l !== lv && l !== sl)), tag(it, sl), tag(other, lv)]);
  else if (type === 'level') t.o = LVORDER.slice();

}

    ${miss ? '<h4 class="mini-h">Para repasar</h4><div class="dwords">' + miss + '</div>' : ''}
    ${ad.conj.msg ? `<p class="hint ad-msg">${esc(ad.conj.msg)}</p>` : ''}

function cjRecord(t, ok) {

  cj.n++; if (ok) cj.ok++;
  const l = cj.lv[t.lv]; l[0]++; if (ok) l[1]++;
  const k = cj.k[it.key] || (cj.k[it.key] = [0, 0]); k[0]++; if (ok) k[1]++;

function cjAnswer(i) {

  const right = t.t === 'level' ? t.lv : t.key + ':' + t.lv, id = t.t === 'level' ? t.o[i] : t.o[i].k;

/* ================= Oído coreano: entrenar las tres series de consonantes =================
   El coreano distingue tres consonantes por cada punto de articulación: suave (ㄱ ㄷ ㅂ ㅈ), aspirada (ㅋ ㅌ ㅍ ㅊ) y tensa (ㄲ ㄸ ㅃ ㅉ).
   Método: explicación explícita + identificación con retroalimentación inmediata y alta variabilidad
   (palabras y sílabas distintas, voces y velocidades distintas), que es lo que mejor funciona en la investigación sobre entrenamiento perceptivo. */
const EAR_SETS = [
  { id: 'p', name: 'ㅂ · ㅍ · ㅃ', words: [[['불', 'bul', 'fuego'], ['풀', 'pul', 'pasto'], ['뿔', 'ppul', 'cuerno']], [['방', 'bang', 'cuarto'], null, ['빵', 'ppang', 'pan']]] },
  { id: 't', name: 'ㄷ · ㅌ · ㄸ', words: [[['달', 'dal', 'luna'], ['탈', 'tal', 'máscara'], ['딸', 'ttal', 'hija']]] },
  { id: 'k', name: 'ㄱ · ㅋ · ㄲ', words: [[['굴', 'gul', 'ostra'], ['쿨', 'kul', 'genial (préstamo)'], ['꿀', 'kkul', 'miel']]] },
  { id: 'j', name: 'ㅈ · ㅊ · ㅉ', words: [[['자다', 'jada', 'dormir'], ['차다', 'chada', 'estar frío'], ['짜다', 'jjada', 'estar salado']], [['지다', 'jida', 'perder'], ['치다', 'chida', 'golpear'], ['찌다', 'jjida', 'cocer al vapor']]] },
  { id: 's', name: 'ㅅ · ㅆ', words: [[['사요', 'sayo', 'compra'], null, ['싸요', 'ssayo', 'es barato']], [['살', 'sal', 'carne / piel'], null, ['쌀', 'ssal', 'arroz crudo']]] }
];
const EAR_LEAD = { p: [7, 17, 8], t: [3, 16, 4], k: [0, 15, 1], j: [12, 14, 13], s: [9, null, 10] };   // índices Unicode de la consonante inicial
const EAR_LROM = { p: ['b', 'p', 'pp'], t: ['d', 't', 'tt'], k: ['g', 'k', 'kk'], j: ['j', 'ch', 'jj'], s: ['s', '', 'ss'] };
const EAR_VOW = [[0, 'a'], [8, 'o'], [13, 'u'], [20, 'i'], [4, 'eo'], [18, 'eu']];
const EAR_SER = ['suave', 'aspirada', 'tensa'];
const EAR_LEN = 12;

const ear = Object.assign({ sess: 0, n: 0, ok: 0, c: {}, conf: {} }, store.get('ear', {}));
const saveEar = () => store.set('ear', ear);
let ex = null;                                                   // sesión actual
let earTalker = null;

/* --- Voces: variar hablante y velocidad entre ensayos (alta variabilidad) --- */
function koVoices() { return hasTTS ? speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)) : []; }
function newTalker() {
  const vs = koVoices();
  const L = adLevel('ear');                                      // Base: voz fija y lenta · Reto: mezcla · Experto: más rápido
  return { voice: vs.length ? (L === 1 ? vs[0] : vs[Math.floor(Math.random() * vs.length)]) : koVoice, rate: pickOne(L === 1 ? [0.7, 0.85] : L === 2 ? [0.7, 0.85, 1] : [0.85, 1, 1.15]), pitch: L === 1 ? 1 : pickOne([0.9, 1, 1.1]) };
}
function earSay(text, tk, done) {
  if (!hasTTS) { done && done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR';
  const t = tk || { rate: 0.85, pitch: 1, voice: koVoice };
  u.rate = t.rate; u.pitch = t.pitch; if (t.voice) u.voice = t.voice;
  let fired = false; const fin = () => { if (!fired) { fired = true; done && done(); } };
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}
function earSeq(list, tk) {                                     // reproduce varias opciones seguidas para compararlas
  const token = ++seqToken;
  const step = i => { if (token !== seqToken || i >= list.length) return; earSay(list[i], tk, () => setTimeout(() => step(i + 1), 450)); };
  step(0);
}

/* --- Ensayos --- */
const earSyl = (c, v) => String.fromCharCode(0xAC00 + (EAR_LEAD[c.id][c.k] * 21 + v[0]) * 28);
function earOptions(id, kind) {                                  // devuelve [{ko, rom, es}] indexado por serie 0/1/2 (null si no existe)
  const set = EAR_SETS.find(s => s.id === id);

    if (s.count > 0) {                                           // día de estudio sin lección

      else { s.lost = { count: s.count, key: k }; s.count = 0; }

/* ================= Lección diaria: motor ================= */
/* Secuencia (cada paso tiene respaldo en la investigación sobre memoria):
   1 Adivina + Aprende (pretest y clave sonora) · 2 Recuerda (recuperación mezclada con palabras viejas)
   3 Escribe (generación) · 4 Escucha (comprensión auditiva) · 5 Palacio (recuperación por lugar) */
const PHASES = [['learn', 'Aprende'], ['recall', 'Recuerda'], ['write', 'Escribe'], ['listen', 'Escucha'], ['palace', 'Palacio']];
const PHASE_OF = { pre: 'learn', learn: 'learn', ch: 'recall', ty: 'write', li: 'listen', lo: 'palace' };
const nr = s => norm(s).normalize('NFC').replace(/[^a-z가-힣]/g, '');   // norm() descompone el hangul (NFD): hay que recomponerlo
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function checkTyped(id, val) {
  const it = BYKO.get(id), v = nr(val); if (!v) return 'no';
  if (v === nr(it.ko) || v === nr(it.rom)) return 'ok';
  const r = nr(it.rom);
  return r.length >= 5 && lev(v, r) <= 1 ? 'near' : 'no';
}

/* --- Construcción de la lección --- */
const wkScore = id => { const c = srsCards[id + ':' + srsCfg.dir] || srsCards[id + ':f'] || srsCards[id + ':r']; return c ? (c.l || 0) * 2 + (2.5 - c.e) + (c.s !== 'r' ? 1 : 0) : 0.5; };
const pickWeak = (ids, n) => shuffle(ids.map(id => ({ id, w: wkScore(id) }))).sort((a, b) => b.w - a.w).slice(0, n).map(x => x.id);
function weakEarlier(idx, n) { return pickWeak([].concat(...CUR.slice(0, idx).map(l => l.items.map(refId))), n); }
function buildRun(idx) {
  const L = CUR[idx], W = L.items.map(refId), tasks = [];
  shuffle(W).forEach(id => { tasks.push({ t: 'pre', id }); tasks.push({ t: 'learn', id }); });
  const E = weakEarlier(idx, 3);
  tasks.push(...shuffle(W.map(id => ({ t: 'ch', id, dir: 'ko-es' })).concat(E.map(id => ({ t: 'ch', id, dir: 'ko-es', old: 1 })))));
  tasks.push(...shuffle(W.map(id => ({ t: 'ch', id, dir: 'es-ko' }))));
  shuffle(W.filter(id => id[0] === 'v')).forEach(id => tasks.push({ t: 'ty', id }));
  if (hasTTS) shuffle(W).forEach(id => tasks.push({ t: 'li', id }));
  const order = id => { const w = BYKO.get(id), r = KR_LEVELS.rooms.findIndex(x => x.cat === w.cat); return r * 100 + roomWords(w.cat).findIndex(x => x.ko === w.ko); };
  W.filter(id => id[0] === 'v' && getMn(id.slice(2))).sort((a, b) => order(a) - order(b)).forEach(id => tasks.push({ t: 'lo', id }));
  return { key: todayKey(), idx, i: 0, tasks, errs: 0, xp: 0, missed: {}, xp0: home.xp };
}
function poolFor(id) {
  const kind = id[0], unl = unlockedRefs(home.lessons), cur = CUR[home.lessons] ? CUR[home.lessons].items.map(refId) : [];
  const ids = new Set([...unl, ...cur].filter(x => x[0] === kind));
  return [...ids].map(x => BYKO.get(x)).filter(Boolean);
}
function optsFor(task) {
  const it = BYKO.get(task.id), key = task.dir === 'es-ko' ? 'ko' : 'es';
  return shuffle([it].concat(distractors(it, poolFor(task.id), key))).map(refIdOf);
}
const refIdOf = it => it.kind + ':' + it.ko;

/* --- Progreso --- */
const saveRun = () => { if (run && run.mode) return; home.run = run; saveHome(); };   // las sesiones especiales no se reanudan
let run = null;
function startLesson() {
  const idx = home.lessons;
  if (idx >= CUR.length || isRestNow()) return;
  if (!(home.run && home.run.key === todayKey() && home.run.idx === idx && home.run.tasks && home.run.i < home.run.tasks.length)) home.run = buildRun(idx);
  run = home.run; hv.view = 'lesson'; saveRun(); renderHome();
}
function requeue(task) {
  if (run.noRq || (task.rq || 0) >= 2) return;
  const c = { t: task.t, id: task.id, dir: task.dir, old: task.old, rq: (task.rq || 0) + 1, pk: task.pk, fix: task.fix };
  if (task.fix) c.o = shuffle(task.fix);
  run.tasks.splice(Math.min(run.tasks.length, run.i + 4), 0, c);
}
function award(n) { n = Math.round(n * (run.xs == null ? 1 : run.xs)); if (n <= 0) return; run.xp += n; addXP(n); }
function markMiss(task) { if (!task.rq && !task.old) run.errs++; run.missed[task.id] = 1; }
function advance() { run.i++; saveRun(); if (run.i >= run.tasks.length) finishLesson(); else renderHome(); }

/* --- Cierre: pasa las palabras al repaso espaciado y da recompensas --- */
function introduceCard(id, g) {
  const dirs = srsCfg.dir === 'both' ? ['f', 'r'] : [srsCfg.dir], now = Date.now();
  dirs.forEach(d => { const cid = id + ':' + d; if (!srsCards[cid]) srsCards[cid] = nextState(null, g, now); });
}
function finishLesson() {
  if (run.mode) return finishSpecial();
  const L = CUR[run.idx], perfect = run.errs === 0, tasksDone = run.tasks.length;
  L.items.forEach(r => introduceCard(refId(r), run.missed[refId(r)] ? 1 : 3));
  saveSrs();
  const before = { lv: levelOf(home.xp) };
  home.lessons = Math.max(home.lessons, run.idx + 1);
  home.stats.words += L.items.length;
  if (perfect) home.stats.perfect++;
  if (run.tasks.some(t => t.t === 'lo')) home.stats.palace++;
  saveHome();
  const day = completeDay(run.idx), s = home.streak;
  const bonus = { base: 30, perfect: perfect ? 20 : 0, streak: Math.min(s.count, 10) * 5 };
  award(bonus.base + bonus.perfect + bonus.streak);
  const coins = addCoins(10 + (perfect ? 5 : 0)) + (day.chest ? 30 : 0);
  const ach = checkAch();
  const sum = { idx: run.idx, xp: run.xp, perfect, bonus, coins, chest: day.chest, ach, words: L.items.map(refId), missed: Object.keys(run.missed), streak: s.count, lvUp: levelOf(home.xp) > before.lv, oldN: run.oldN || 0, oldOk: run.oldOk || 0 };
  if (sum.oldN) { home.stats.oldN = (home.stats.oldN || 0) + sum.oldN; home.stats.oldOk = (home.stats.oldOk || 0) + sum.oldOk; }
  home.run = null; run = null; saveHome(); updateBadge(); updateHomeDot();
  hv.view = 'done'; hv.sum = sum; celebrate(); renderHome();
}

}
function faceLocus(task) {
  const it = BYKO.get(task.id), m = getMn(it.ko), r = roomOf(it.ko);
  const front = `<span class="tag">Palacio · ${esc(r.name)}</span><div class="locus-big">${esc(m.locus)}</div><p class="hint" style="margin:6px 0 0">Ve mentalmente a ese lugar. ¿Qué palabra vive ahí?</p>`;
  const back = task.shown ? `<hr class="ans-sep"><div class="ko" lang="ko">${esc(it.ko)}</div><div class="rom always">${esc(it.rom)}</div><div class="es big">${esc(it.es)}</div><div class="sound">Suena como: ${esc(m.sound)}</div><p class="story c">${esc(m.story)}</p>` : '';
  const act = !task.shown ? '<button class="btn acc" id="lsReveal">Mostrar la palabra</button>'
    : task.res ? '<button class="btn acc" id="lsNext">Continuar →</button>'
    : '<button class="btn acc" data-rate="1">La recordé</button><button class="btn" data-rate="0">No la recordé</button>';
  return `<div class="qcard">${front}${back}</div><div class="fc-actions">${task.shown ? `<button class="icon" id="lsSay" aria-label="Escuchar">${ICON.speaker}</button>` : ''}${act}</div>`;
}

function faceCmp(task) {
  const a = BYKO.get(task.id), b = BYKO.get(task.b);
  const col = (it, id) => `<div class="cmpcol"><div class="ko" lang="ko"${koStyle(it)}>${esc(it.ko)}</div><div class="rom always">${esc(it.rom)}</div><div class="es">${esc(it.es)}</div><button class="icon" data-say="${esc(it.ko)}" aria-label="Escuchar ${esc(it.ko)}">${ICON.speaker}</button></div>`;
  const ma = it => { const m = it.kind === 'v' && getMn(it.ko); return m ? `<div class="hint" style="margin-top:6px">Suena como: ${esc(m.sound)}</div>` : ''; };
  return `<div class="qcard qlearn"><span class="tag">Las confundes: míralas juntas</span>
    <div class="cmp">${col(a)}<span class="vs">vs</span>${col(b)}</div>
    <div class="cmp cmp-mn"><div>${ma(a)}</div><div></div><div>${ma(b)}</div></div>
    <p class="hint" style="margin-top:12px">Di cada una en voz alta y fíjate en qué sílaba cambian. Ahora las practicarás en pares.</p></div>
    <div class="fc-actions"><button class="btn acc" id="lsNext">Practicar →</button></div>`;
}
function renderLesson() {
  stopAudio();
  const task = run.tasks[run.i]; if (!task) { finishLesson(); return; }
  const pct = run.i / run.tasks.length * 100, from = renderLesson.pct == null || renderLesson.key !== run.idx + ':' + (run.mode || '') ? pct : renderLesson.pct;   // la barra avanza desde donde estaba
  renderLesson.pct = pct; renderLesson.key = run.idx + ':' + (run.mode || '');
  const face = task.t[0] === 'g' ? faceGram(task) : task.t === 'cmp' ? faceCmp(task) : task.t === 'learn' ? faceLearn(task) : task.t === 'ty' ? faceType(task) : task.t === 'lo' ? faceLocus(task) : faceOpt(task);
  hEl.innerHTML = `<div class="stage lesson">
    <div class="stage-top"><button class="btn ghost sm" id="lsExit">← Salir</button><span>${run.mode ? esc(run.label) : 'Lección ' + (run.idx + 1)} · ${run.i + 1} de ${run.tasks.length}</span><span class="xpchip">${ICON.star} ${run.xp} XP</span></div>
    ${stepsHTML(task)}<div class="bar"><i style="width:${pct}%;--from:${from}%"></i></div>${face}</div>`;
  enterOnce(hEl, 'L:' + run.idx + ':' + (run.mode || '') + ':' + run.i);
  if (task.t === 'ty' && !task.res) setTimeout(() => { const i = $('#tyIn'); if (i) i.focus({ preventScroll: true }); }, 30);
  if ((task.res || task.t === 'learn' || task.t === 'cmp' || task.t === 'gobs') && $('#lsNext')) $('#lsNext').focus({ preventScroll: true });
  if (task.t === 'learn' || task.t === 'cmp' || task.t === 'gobs' || (!task.res && task.t !== 'ty' && task.t !== 'gor') || (task.t === 'gor' && !task.sc && (task.sc = 1))) window.scrollTo(0, 0);
  if ((task.t === 'learn' || (task.t === 'li' && !task.res)) && !task.played) { task.played = true; setTimeout(() => speak(BYKO.get(task.id).ko), 250); }
}

/* --- Respuestas --- */
function answerOpt(i) {
  const task = run.tasks[run.i]; if (!task || task.res || !task.o || !task.o[i]) return;
  const right = task.o[i] === task.id;
  task.res = right ? 'ok' : 'no'; task.pick = i;
  home.stats.ans++; if (right) home.stats.ok++;
  if (task.t !== 'pre') skill(task.t === 'li' ? 'oid' : 'lec', right);
  if (task.old && !task.rq) { run.oldN = (run.oldN || 0) + 1; if (right) run.oldOk = (run.oldOk || 0) + 1; }   // recuerdo de palabras de lecciones anteriores
  if (task.t === 'pre') award(2);
  else if (right) award(task.rq ? 2 : 5);
  else { markMiss(task); requeue(task); recConf(task.id, task.o[i]); }
  saveRun();
  if (run.noFb) return advance();
  renderLesson();
}
function answerType(val, skip) {
  const task = run.tasks[run.i]; if (!task || task.res) return;
  const r = skip ? 'no' : checkTyped(task.id, val);
  task.res = r; task.val = skip ? '' : val;
  home.stats.ans++; if (r !== 'no') home.stats.ok++;
  skill('esc', r !== 'no');
  if (r === 'no') { markMiss(task); requeue(task); } else award(task.rq ? 5 : task.hint ? 5 : 8);
  saveRun(); renderLesson();
}
function rateLocus(good) {
  const task = run.tasks[run.i]; if (!task || task.res) return;
  task.res = good ? 'ok' : 'no'; award(good ? 5 : 2); saveRun(); renderLesson();
}
function onLessonClick(e) {
  if (hv.view !== 'lesson' || !run) return;
  const task = run.tasks[run.i], t = e.target;
  if (task && task.t[0] === 'g' && !t.closest('#lsExit, #lsNext')) return gramClick(e, task);
  const opt = t.closest('.opt'); if (opt && !opt.disabled) return answerOpt(+opt.dataset.i);
  if (t.closest('#lsExit')) { hv.view = 'dash'; stopAudio(); renderHome(); return; }
  if (t.closest('#lsNext')) return advance();
  const sy = t.closest('[data-say]'); if (sy && task.t === 'cmp') return speak(sy.dataset.say);
  if (t.closest('#lsSay')) return speak(BYKO.get(task.id).ko);
  if (t.closest('#lsEdit')) return openMn(BYKO.get(task.id).ko, true);
  if (t.closest('#lsHint')) { task.hint = true; saveRun(); const v = $('#tyIn') ? $('#tyIn').value : ''; renderLesson(); if ($('#tyIn')) $('#tyIn').value = v; return; }
  if (t.closest('#lsSkip')) return answerType('', true);
  if (t.closest('#lsReveal')) { task.shown = true; saveRun(); renderLesson(); return; }
  const rt = t.closest('[data-rate]'); if (rt) return rateLocus(rt.dataset.rate === '1');
}
hEl.addEventListener('click', onLessonClick);
hEl.addEventListener('submit', e => { if (e.target.id === 'tyForm') { e.preventDefault(); answerType($('#tyIn').value, false); } });
document.addEventListener('keydown', e => {
  if (state.tab !== 'home' || hv.view !== 'lesson' || !run || locked || dlg.open || e.ctrlKey || e.metaKey) return;
  const task = run.tasks[run.i]; if (!task) return;
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const onBtn = e.target.tagName === 'BUTTON';
  if (/^[1-4]$/.test(e.key) && task.o && !task.res && (task.t === 'pre' || task.t === 'ch' || task.t === 'li')) answerOpt(+e.key - 1);
  else if (e.key === 'Enter' && !onBtn && (task.t === 'learn' || task.t === 'cmp' || task.t === 'gobs' || (task.res && task.t !== 'lo') || (task.t === 'lo' && task.res))) { e.preventDefault(); advance(); }
});

/* ================= Sesiones especiales: jefe de bloque, diagnóstico, práctica extra y laboratorio de errores =================
   Reutilizan el motor de la lección diaria (run / tareas), pero no tocan la racha ni se reanudan al salir. */
const MODES = {
  boss: { label: 'Jefe de bloque', noRq: 1, xs: 0 },
  diag: { label: 'Diagnóstico', noRq: 1, noFb: 1, xs: 0 },
  extra: { label: 'Práctica extra', xs: 0.5 },
  lab: { label: 'Laboratorio', xs: 0.5 },
  gram: { label: 'Gramática', noRq: 1, xs: 0 }
};
const pairKey = (a, b) => [a, b].sort().join('|');
function recConf(a, b) {                                         // registra "confundí a con b" (sin orden)
  if (!b || a === b) return;
  const k = pairKey(a, b); home.conf[k] = (home.conf[k] || 0) + 1;
  const ks = Object.keys(home.conf);
  if (ks.length > 80) ks.sort((x, y) => home.conf[x] - home.conf[y]).slice(0, ks.length - 80).forEach(x => delete home.conf[x]);
  saveHome();
}
function startSpecial(mode, tasks, meta) {
  if (!tasks || !tasks.length) return toast('Todavía no hay suficiente material para esta actividad.');
  const m = MODES[mode];
  run = Object.assign({ mode, label: m.label, key: todayKey(), idx: home.lessons, i: 0, tasks, errs: 0, xp: 0, missed: {}, xp0: home.xp, noRq: !!m.noRq, noFb: !!m.noFb, xs: m.xs }, meta || {});
  hv.view = 'lesson'; hv.sum = null;
  if (state.tab !== 'home') showTab('home'); else renderHome();
}

/* --- Constructores de tareas --- */
const chT = (id, dir, more) => Object.assign({ t: 'ch', id, dir }, more || {});
const fixOpts = (id, others) => { const f = [id].concat(others); return { fix: f, o: shuffle(f) }; };
function mixTasks(ids, n) {
  return ids.slice(0, n).map((id, k) => chT(id, k % 2 ? 'es-ko' : 'ko-es'));
}
function buildBoss(stage) {
  const ids = pickWeak(blockIds(stage), 10), tasks = [];
  const li = hasTTS ? 2 : 0;
  ids.forEach((id, k) => { if (k >= 10 - li) tasks.push({ t: 'li', id }); else tasks.push(chT(id, k < 5 ? 'ko-es' : 'es-ko')); });
  return shuffle(tasks);
}
function diagIds() {                                             // 12 palabras fijas repartidas por todo el currículo (mismas en cada intento)
  const ord = CUR.slice().sort((a, b) => a.id - b.id).filter(l => l.kind === 'v');
  return ord.filter((l, i) => i % 2 === 1).slice(0, 12).map((l, i) => refId(l.items[(i * 2 + 1) % l.items.length]));
}
function buildDiag() {
  return shuffle(diagIds()).map(id => { const it = BYKO.get(id), o = shuffle([it].concat(distractors(it, VOCAB, 'es'))).map(refIdOf); return chT(id, 'ko-es', { o }); });
}
function buildExtra(kind) {
  const unl = [...unlockedRefs(home.lessons)];
  if (unl.length < 5) return [];
  if (kind === 'ty') return pickWeak(unl.filter(x => x[0] === 'v'), 6).map(id => ({ t: 'ty', id }));
  if (kind === 'li') return pickWeak(unl, 8).map(id => ({ t: 'li', id }));
  return shuffle(mixTasks(pickWeak(unl, 8), 8));
}
function nearestRef(id, pool) {                                  // la palabra más parecida en sonido (romanización) entre las conocidas
  const a = BYKO.get(id); let best = null, bd = 99;
  pool.forEach(x => { if (x === id || x[0] !== id[0]) return; const b = BYKO.get(x); const d = lev(nr(a.rom), nr(b.rom)) + (b.es === a.es ? 9 : 0) + Math.random() * 0.4; if (d < bd) { bd = d; best = x; } });
  return best;
}
function labPairs() {
  const unl = new Set(unlockedRefs(home.lessons));
  let pairs = Object.entries(home.conf).filter(([k, n]) => n > 0 && k.split('|').every(x => unl.has(x))).sort((a, b) => b[1] - a[1]).map(([k]) => k.split('|'));
  if (pairs.length < 3) {                                        // sin errores registrados: los más frágiles del repaso con su vecino más parecido
    const weak = [...unl].map(id => ({ id, w: wkScore(id) })).filter(x => x.w > 1.2).sort((a, b) => b.w - a.w).slice(0, 6);
    weak.forEach(x => { const y = nearestRef(x.id, [...unl]); if (y && !pairs.some(p => p.includes(x.id) || p.includes(y))) pairs.push([x.id, y]); });
  }
  return pairs.slice(0, 3);
}
function buildLab() {
  const unl = [...unlockedRefs(home.lessons)], tasks = [];
  labPairs().forEach(([a, b]) => {
    const pk = pairKey(a, b), third = id => { const c = optsFor({ id, dir: 'ko-es' }).filter(x => x !== a && x !== b && x !== id); return c[0]; };
    tasks.push({ t: 'cmp', id: a, b });
    [[a, b, 'ko-es'], [b, a, 'es-ko'], [b, a, 'ko-es'], [a, b, 'es-ko']].forEach(([x, y, dir]) => {
      const t = third(x); tasks.push(chT(x, dir, Object.assign({ pk }, fixOpts(x, [y].concat(t ? [t] : [])))));
    });
  });
  return tasks;
}
const labCount = () => labPairs().length;

/* --- Cierre --- */
function finishSpecial() {
  if (run.mode === 'gram') return finishGram();
  const R = run, qs = R.tasks.filter(t => !t.rq && t.t !== 'cmp'), okOf = t => t.res === 'ok' || t.res === 'near';
  const ok = qs.filter(okOf).length, tot = qs.length, t0 = todayKey();
  const S = { mode: R.mode, ok, tot, xp: R.xp, coins: 0, missed: [...new Set(qs.filter(t => !okOf(t)).map(t => t.id))] };
  if (R.mode === 'boss') {
    S.stage = R.stage; S.pass = ok / tot >= 0.8;
    const b = home.bosses[R.stage] || { best: 0, n: 0, pass: false };
    b.n++; b.best = Math.max(b.best, ok); S.first = S.pass && !b.pass;
    if (S.pass) { b.pass = true; b.d = b.d || t0; home.stats.boss++; S.xp = S.first ? 60 : 10; addXP(S.xp); if (S.first) S.coins = addCoins(40); }
    home.bosses[R.stage] = b;
  } else if (R.mode === 'diag') {
    const seen = qs.filter(t => unlockedRefs(home.lessons).has(t.id));
    S.seen = seen.length; S.seenOk = seen.filter(okOf).length; S.prev = home.diag[home.diag.length - 1] || null;
    home.diag.push({ k: t0, n: ok, tot, seen: S.seen, seenOk: S.seenOk, lessons: home.lessons });
    if (home.diag.length > 30) home.diag.shift();
    home.stats.diag++;
    S.xp = bonusOnce('diag', 20); S.coins = home.bonus[t0 + ':diagc'] ? 0 : (home.bonus[t0 + ':diagc'] = 1, addCoins(10));
  } else if (R.mode === 'extra') {
    home.stats.extra++; home.extra[t0] = (home.extra[t0] || 0) + 1;
    if (home.extra[t0] === 1) S.coins = addCoins(3);
  } else if (R.mode === 'lab') {
    R.tasks.filter(t => t.pk && !t.rq && okOf(t)).forEach(t => { if (home.conf[t.pk]) { home.conf[t.pk]--; if (home.conf[t.pk] <= 0) delete home.conf[t.pk]; } });
    S.pairs = R.tasks.filter(t => t.t === 'cmp').length;
    home.stats.lab++; S.xp += bonusOnce('lab', 20);
    if (!home.bonus[t0 + ':labc']) { home.bonus[t0 + ':labc'] = 1; S.coins = addCoins(3); }
  }
  run = null; saveHome(); updateHomeDot(); checkAch();
  hv.view = 'done'; hv.sum = S; if (S.pass || R.mode === 'diag') celebrate();
  renderHome();
}

/* --- Pantalla de resultado --- */
function missedHTML(ids) {
  return ids.length ? `<h4 class="mini-h">Para repasar</h4><div class="dwords">${ids.map(id => { const w = BYKO.get(id); return `<div class="r-row"><div><span class="ko" lang="ko" style="font-size:22px">${esc(w.ko)}</span> <span class="rom">${esc(w.rom)}</span><div class="es">${esc(w.es)}</div></div><button class="icon" data-say="${esc(w.ko)}" aria-label="Escuchar">${ICON.speaker}</button></div>`; }).join('')}</div>` : '';
}
function renderSpecialDone(S) {
  if (S.mode === 'gram') return renderGramDone(S);
  const rew = `${S.xp ? `+${S.xp} XP` : ''}${S.xp && S.coins ? ' · ' : ''}${S.coins ? `+${S.coins} monedas` : ''}`;
  let head, body, again = '';
  if (S.mode === 'boss') {
    const st = STAGES[S.stage];
    head = S.pass ? '¡Jefe superado!' : 'Casi lo logras';
    body = `<div class="score">${S.ok}<span> / ${S.tot}</span></div>
      <p class="lede" style="margin:6px auto 4px">${S.pass ? `Sello de <b>${esc(st.es)}</b> ${S.first ? 'conseguido' : 'renovado'}. ${S.first ? 'Tu viaje sigue.' : 'Ya lo tenías: repetirlo solo fortalece la memoria.'}` : 'Hacen falta 8 de 10. No pierdes nada: repasa lo que falló y vuelve cuando quieras.'}</p>${missedHTML(S.missed)}`;
    again = `<button class="btn${S.pass ? '' : ' acc'}" data-sp="boss:${S.stage}">${S.pass ? 'Jugar otra vez' : 'Reintentar'}</button>`;
  } else if (S.mode === 'diag') {
    head = 'Diagnóstico completo';
    const d = S.prev;
    body = `<div class="score">${S.ok}<span> / ${S.tot}</span></div>
      <p class="lede" style="margin:6px auto 4px">${S.seen ? `De las <b>${S.seen}</b> palabras del test que ya estudiaste acertaste <b>${S.seenOk}</b>.${S.seen < S.tot ? ' Las demás aún no las has visto: acertarlas es intuición o suerte.' : ''}` : 'Todavía no has estudiado ninguna de estas palabras: los aciertos de hoy son intuición o suerte, y ese es tu punto de partida.'}</p>
      ${d ? `<p class="hint">Intento anterior (${d.lessons} lecciones): <b>${d.n} de ${d.tot}</b>. ${S.ok > d.n ? 'Subiste ' + (S.ok - d.n) + '.' : S.ok === d.n ? 'Igual que la vez pasada.' : 'Bajó un poco: es normal, mira el detalle abajo.'}</p>` : '<p class="hint">Este es tu punto de partida. Repítelo cada par de semanas para ver cuánto avanzaste.</p>'}${missedHTML(S.missed)}`;
    again = '';
  } else if (S.mode === 'lab') {
    head = 'Laboratorio completo';
    body = `<div class="score">${S.ok}<span> / ${S.tot}</span></div><p class="lede" style="margin:6px auto 4px">Practicaste ${S.pairs} par${S.pairs === 1 ? '' : 'es'} de palabras que se te mezclan. Los pares que aciertas dejan de aparecer.</p>${missedHTML(S.missed)}`;
    again = labCount() ? '<button class="btn" data-sp="lab">Otra ronda</button>' : '';
  } else {
    head = 'Práctica extra completa';
    body = `<div class="score">${S.ok}<span> / ${S.tot}</span></div><p class="lede" style="margin:6px auto 4px">Extra suma la mitad de XP y no cambia tu racha: es para practicar, no para presionarte.</p>${missedHTML(S.missed)}`;
    again = '<button class="btn" data-go-sub="retos">Otra práctica</button>';
  }
  hEl.innerHTML = `<div class="stage"><div class="box result done-box"><span class="tag">${esc(MODES[S.mode].label)}</span>
    <h2 style="font-size:26px;font-weight:500;margin:4px 0 8px">${head}</h2>
    ${rew ? `<div class="xp-big" style="font-size:22px">${rew}</div>` : ''}${body}
    <div class="row" style="justify-content:center;margin-top:14px">${again}<button class="btn ghost" id="doneBack">Volver</button></div></div></div>`;
  window.scrollTo(0, 0);
}

/* --- Despachador de botones data-sp="modo[:parámetro]" --- */
function spGo(s) {
  const [m, p] = s.split(':');
  if (m === 'boss') return startSpecial('boss', buildBoss(+p), { stage: +p });
  if (m === 'diag') return startSpecial('diag', buildDiag());
  if (m === 'extra') return startSpecial('extra', buildExtra(p || 'mix'));
  if (m === 'lab') return startSpecial('lab', buildLab());
}
hEl.addEventListener('click', e => {
  const b = e.target.closest('[data-sp]'); if (!b || (hv.view !== 'dash' && hv.view !== 'done')) return;
  spGo(b.dataset.sp);
});

/* --- Tarjeta del laboratorio dentro de Repaso --- */
function labCardHTML() {
  const n = typeof labPairs === 'function' ? labPairs().length : 0;
  if (!n) return '';
  return `<div class="box"><h3>Laboratorio de errores <span class="ko-s" style="font-size:14px">실험실</span></h3>
    <p class="lede">Hay ${n} par${n === 1 ? '' : 'es'} de palabras que se te mezclan. Practicarlas juntas ayuda a separarlas.</p>
    <div><button class="btn" data-splab>Entrenar ahora</button></div></div>`;
}
document.addEventListener('click', e => { if (e.target.closest('[data-splab]')) spGo('lab'); });

/* ================= Gramática: patrones para conversar (15 originales + 14 del bloque 1 + 8 del bloque 2) =================
   Cada oración se escribe así:  'coreano con {respuesta}|romanización|español|palabras necesarias|distractores'
   · lo que va entre llaves es la parte que se practica (hueco en los ejercicios y resaltado en los ejemplos)
   · palabras necesarias: vocabulario que debes haber visto (separado por comas; 'p:' delante = frase completa)
   · distractores: opciones incorrectas separadas por '/' (si faltan, se usa el grupo de opciones del patrón)
   Los ejemplos usan solo palabras ya estudiadas; un patrón se abre cuando hay al menos 5 oraciones disponibles.
   REGLA DE ORO: el guardado de cada persona apunta a estos patrones por su id y, en el Repaso, por la posición de cada oración
   (g:id:número). Por eso NUNCA se cambia el id de un patrón ni se reordenan o borran sus oraciones: solo se añaden al final. */
const GRAM = [
  { id: 'copula', blk: 'A', at: 4, ko: '이에요 / 예요', es: 'Ser: «es un…»',
    short: 'Termina en vocal → 예요 · termina en consonante → 이에요.',
    rule: [
      'Para decir «es / soy» pega <b>이에요</b> o <b>예요</b> al final de un sustantivo. Si termina en <b>vocal</b> va <b>예요</b>; si termina en <b>consonante</b> va <b>이에요</b>.',
      '커피 (vocal) → 커피<b>예요</b> · 물 (consonante ㄹ) → 물<b>이에요</b>. Si subes el tono al final se vuelve pregunta: 커피예요?'],
    tip: 'Es el verbo «ser» en nivel cortés (해요체). En Cortesía ya viste sus formas casual y formal.',
    pool: ['이에요', '예요'],
    disc: { q: 'Fíjate en 커피예요, 메뉴예요, 물이에요 y 라면이에요. ¿Qué decide si va 예요 o 이에요?', a: 'Si la palabra termina en vocal o en consonante', o: ['El significado de la palabra', 'Si habla de una persona o de una cosa'] },
    items: [

/* ================= Gramática: mini-lecciones, biblioteca y tarjetas de Repaso =================
   Cada patrón se aprende en tres movimientos: primero ves ejemplos con la parte clave resaltada, luego intentas deducir la regla
   (y se te explica), y al final la practicas completando y ordenando frases. Solo se usan palabras que ya has visto.
   No afecta la racha: es opcional. Al terminar, unas tarjetas de completar pasan al Repaso espaciado. */
const GRAM_BLK = { A: 'Frases básicas', B: 'Hacer cosas', C: 'Conectar ideas' };
function parseGItem(s, i) {
  const f = s.split('|'), ko = f[0], m = ko.match(/\{([^}]*)\}/);
  return { i, ko: ko.replace(/[{}]/g, ''), pre: ko.slice(0, m.index), ans: m[1], post: ko.slice(m.index + m[0].length), rom: f[1], es: f[2], need: f[3] ? f[3].split(',') : [], d: f[4] ? f[4].split('/') : null };
}
const GP = GRAM.map(p => Object.assign({}, p, { items: p.items.map(parseGItem) }));
const GBY = new Map(GP.map(p => [p.id, p]));
const gRef = n => n.startsWith('p:') ? n : 'v:' + n;
const gKnown = it => { const u = unlockedRefs(home.lessons); return it.need.every(n => u.has(gRef(n))); };
const gAvail = p => p.items.filter(gKnown);
const gOpen = p => home.lessons >= p.at && gAvail(p).length >= 5;
const gDone = p => !!(home.gram[p.id] && home.gram[p.id].n);
const gNext = () => GP.find(p => gOpen(p) && !gDone(p));
const gHL = it => esc(it.pre) + '<mark>' + esc(it.ans) + '</mark>' + esc(it.post);
const gOpts = (p, it) => shuffle([it.ans].concat(shuffle(it.d || p.pool.filter(x => x !== it.ans)).slice(0, 2)));
const gSay = ko => `<button class="icon" data-gsay="${esc(ko)}" aria-label="Escuchar">${ICON.speaker}</button>`;

/* --- Construcción de las sesiones --- */
function gBank(it) { const w = it.ko.split(' '); let b = shuffle(w), k = 0; while (b.join(' ') === w.join(' ') && k++ < 8) b = shuffle(w); return b; }
function buildGram(pid) {
  const p = GBY.get(pid), A = gAvail(p), ex = A.slice(0, 5), fresh = shuffle(A.slice(5)), seen = shuffle(ex);
  const cl = fresh.slice(0, 3).concat(seen).slice(0, 5).map(it => ({ t: 'gcl', pid, ii: it.i, o: gOpts(p, it) }));
  const or = shuffle(A.filter(it => { const n = it.ko.split(' ').length; return n >= 2 && n <= 5; })).slice(0, 2).map(it => ({ t: 'gor', pid, ii: it.i, bank: gBank(it), seq: [] }));
  const tasks = [{ t: 'gobs', pid, ex: ex.map(x => x.i) }, { t: 'gdis', pid, o: shuffle([p.disc.a].concat(p.disc.o)) }];
  [cl[0], cl[1], cl[2], or[0], cl[3], cl[4], or[1]].forEach(x => { if (x) tasks.push(x); });
  return tasks;
}
function buildGramMix() {
  const pool = shuffle(GP.filter(gDone)).map(p => ({ p, its: shuffle(gAvail(p)) })), out = [];
  for (let k = 0; out.length < 8 && pool.some(x => x.its.length) && k < 200; k++) {
    const x = pool[k % pool.length], it = x.its.pop(); if (!it) continue;
    out.push({ t: 'gcl', pid: x.p.id, ii: it.i, o: gOpts(x.p, it), mix: 1 });
  }

}
function startGram(v) {
  if (v === 'mix') return startSpecial('gram', buildGramMix(), { pid: null, mix: true, label: 'Práctica de gramática' });
  const p = GBY.get(v); if (!p || !gOpen(p)) return;
  startSpecial('gram', buildGram(v), { pid: v, label: 'Patrón · ' + p.ko });
}

/* --- Caras de cada tarea --- */
const gExHTML = it => `<div class="gex"><span class="ko" lang="ko">${gHL(it)}</span><span class="rom always">${esc(it.rom)}</span><span class="es">${esc(it.es)}</span>${gSay(it.ko)}</div>`;
const gRuleBlock = p => p.rule.map(r => `<p>${r}</p>`).join('');

      <div class="gsent" lang="ko">${esc(it.pre)}${blank}${esc(it.post)}</div><div class="es big" style="font-size:19px">${esc(it.es)}</div>${task.res ? `<div class="rom always">${esc(it.rom)}</div>` : ''}</div>

      : `<div class="row" style="justify-content:center;margin-top:8px"><button class="btn acc" data-gcheck ${task.seq.length === task.bank.length ? '' : 'disabled'}>Comprobar</button>${task.seq.length ? '<button class="btn ghost" data-gclear>Borrar</button>' : ''}</div>`}`;
}

/* --- Respuestas --- */
function gRequeue(task) {                                        // los fallos vuelven una vez, unos pasos después
  if (task.rq) return;
  const c = Object.assign({}, task, { res: null, pick: null, rq: 1, sc: 0 }), p = GBY.get(c.pid);
  if (c.t === 'gcl') c.o = gOpts(p, p.items[c.ii]);
  if (c.t === 'gor') { c.bank = gBank(p.items[c.ii]); c.seq = []; }
  run.tasks.splice(Math.min(run.tasks.length, run.i + 4), 0, c);
}
function gAnswer(task, right) {
  task.res = right ? 'ok' : 'no'; skill('gra', right);
  if (!right) { run.errs++; run.missed[task.pid + ':' + task.ii] = 1; gRequeue(task); }
  renderLesson();
}
function gramClick(e, task) {
  const t = e.target, gi = t.closest('[data-gi]');
  if (gi && !gi.disabled && !task.res) {
    const i = +gi.dataset.gi; task.pick = i;
    if (task.t === 'gdis') { task.res = task.o[i] === GBY.get(task.pid).disc.a ? 'ok' : 'no'; skill('gra', task.res === 'ok'); renderLesson(); }
    else if (task.t === 'gcl') gAnswer(task, task.o[i] === GBY.get(task.pid).items[task.ii].ans);
    return;
  }
  if (task.t !== 'gor' || task.res) return;
  const b = t.closest('[data-gb]'), u = t.closest('[data-gu]');
  if (b) { task.seq.push(+b.dataset.gb); renderLesson(); }
  else if (u) { task.seq = task.seq.filter(x => x !== +u.dataset.gu); renderLesson(); }
  else if (t.closest('[data-gclear]')) { task.seq = []; renderLesson(); }
  else if (t.closest('[data-gcheck]') && task.seq.length === task.bank.length) gAnswer(task, task.seq.map(bi => task.bank[bi]).join(' ') === GBY.get(task.pid).items[task.ii].ko);
}
document.addEventListener('keydown', e => {
  if (state.tab !== 'home' || hv.view !== 'lesson' || !run || run.mode !== 'gram' || locked || dlg.open || e.ctrlKey || e.metaKey) return;
  const task = run.tasks[run.i]; if (!task || task.res || !/^[1-4]$/.test(e.key) || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (task.t === 'gcl' || task.t === 'gdis') { const b = hEl.querySelector('[data-gi="' + (+e.key - 1) + '"]'); if (b) b.click(); }
});

/* --- Cierre --- */
function gramCards(pid, missed) {                                // deja hasta 6 tarjetas de completar de cada patrón en el Repaso
  const p = GBY.get(pid), have = p.items.filter(it => srsCards['g:' + pid + ':' + it.i]).length; if (have >= 6) return 0;
  const cand = shuffle(gAvail(p).filter(it => !srsCards['g:' + pid + ':' + it.i])).sort((a, b) => (missed[b.i] ? 1 : 0) - (missed[a.i] ? 1 : 0)).slice(0, Math.min(3, 6 - have)), now = Date.now();
  cand.forEach(it => { srsCards['g:' + pid + ':' + it.i] = nextState(null, missed[it.i] ? 1 : 3, now); });
  if (cand.length) { saveSrs(); updateBadge(); }
  return cand.length;
}

/* --- Datos guardados: récords, tope diario y palabras falladas --- */
function gmData() {
  const g = home.games || (home.games = {}), D = { rec: {}, day: '', xp: 0, coins: 0, played: {}, plays: 0, miss: {}, opt: {}, kbd: 0, wsolved: 0, wd: {}, ever: {}, tower: 0 };
  Object.keys(D).forEach(k => { if (g[k] == null) g[k] = D[k]; });
  if (g.day !== todayKey()) { g.day = todayKey(); g.xp = 0; g.coins = 0; g.played = {}; }
  return g;
}
function gmRec(id, key, val, low) {                              // devuelve { best, isNew }; low = gana el menor
  const g = gmData(), k = id + ':' + key, old = g.rec[k];
  const isNew = old == null ? val > 0 || low : low ? val < old : val > old;
  if (isNew && (low || val > 0)) g.rec[k] = val;
  return { best: g.rec[k] != null ? g.rec[k] : val, isNew: !!isNew && (low || val > 0) && old != null };
}

  const g = gmData(); perf = clamp01(perf);
  let xp = Math.max(0, Math.min(Math.round(perf * 15), GM_XP_CAP - g.xp)), coins = 0;
  if (xp > 0) { g.xp += xp; addXP(xp); }
  if (!g.played[id] && perf >= 0.3 && g.coins < GM_COIN_CAP) { coins = Math.min(2, GM_COIN_CAP - g.coins); g.coins += coins; addCoins(coins); }
  g.played[id] = (g.played[id] || 0) + 1; g.ever[id] = 1; g.plays++; home.stats.games++;
  saveHome(); checkAch();

}

function startPares(c) {
  const usePhr = c.o.src === 'fra' && gmPhr().length >= 6, pool = usePhr ? gmPhr() : gmWords();

  const used = new Set(), L = [];

const SIL_FILL = ['요', '는', '은', '을', '를', '이', '가', '에', '서', '고', '지', '어'];
function silCase(c, prev) {
  const ter = c.o.src === 'ter' && GP.some(gDone);
  if (ter) {
    const items = GP.filter(gDone).flatMap(p => gAvail(p).map(it => ({ p, it }))).filter(x => x.it.ans.length >= 1 && (!prev || prev.it !== x.it));
    if (items.length >= 4) {
      const { p, it } = gmPick(items), a = it.ans, sibs = (it.d || p.pool.filter(x => x !== a)).filter(s => s.length === a.length);
      let i = 0; if (a.length > 1) { const f = sibs.find(s => s !== a); i = f ? [...a].findIndex((ch, k) => ch !== f[k]) : 0; if (i < 0) i = 0; }
      const ans = a[i], wrong = [...new Set(sibs.map(s => s[i]).filter(ch => ch && ch !== ans))];
      SIL_FILL.forEach(ch => { if (ch !== ans && !wrong.includes(ch) && wrong.length < 5) wrong.push(ch); });
      return { kind: 'ter', pre: it.pre + a.slice(0, i), post: a.slice(i + 1) + it.post, ans, o: shuffle([ans].concat(wrong.slice(0, 3))), ko: it.ko, rom: it.rom, es: it.es, it, p };
    }
  }
  const ws = gmWords().filter(w => gmHan(w) && w.ko.length >= 2 && (!prev || prev.ko !== w.ko)), w = BYKO.get(pickWeak(ws.map(refIdOf), 1)[0]) || gmPick(ws);
  const i = Math.floor(Math.random() * w.ko.length), ans = w.ko[i], sy = s => syllInfo(s) || {};
  const all = [...new Set(gmWords().filter(gmHan).flatMap(x => [...x.ko]))].filter(s => s !== ans);
  const score = s => (sy(s).i === sy(ans).i ? 2 : 0) + (sy(s).v === sy(ans).v ? 2 : 0) + (sy(s).t === sy(ans).t ? 1 : 0) + Math.random();
  const known = new Set(gmWords().map(x => x.ko)), wrong = all.filter(s => !known.has(w.ko.slice(0, i) + s + w.ko.slice(i + 1))).sort((a, b) => score(b) - score(a)).slice(0, 3);
  return { kind: 'pal', pre: w.ko.slice(0, i), post: w.ko.slice(i + 1), ans, o: shuffle([ans].concat(wrong)), ko: w.ko, rom: w.rom, es: w.es, w };
}
function startSilaba(c) {

    const body = `<div class="qcard"><span class="tag">${q.kind === 'ter' ? 'Termina la frase · ' + esc(q.p.ko) : 'Falta una sílaba'}</span>
      <div class="gsent" lang="ko">${esc(q.pre)}${blank}${esc(q.post)}</div><div class="es big" style="font-size:19px">${esc(q.es)}</div>${done ? `<div class="rom always">${esc(q.rom)}</div>` : ''}</div>`;
    const opts = !typed ? `<div class="opts">${q.o.map((o, k) => optBtn(k + 1, `<span class="o-ko" lang="ko">${esc(o)}</span>`, done ? (o === q.ans ? ' right' : k === c.pick ? ' wrong' : '') : '', `data-si="${k}" ${done ? 'disabled' : ''}`)).join('')}</div>`

    const fb = done ? `<div class="feedback ${c.res === 'ok' ? 'ok' : 'no'}"><span><b>${c.res === 'ok' ? '¡Correcto!' : 'Casi.'}</b> <span class="fk"><span lang="ko">${esc(q.ko)}</span> · ${esc(q.es)}${q.kind === 'ter' ? ' · ' + esc(q.p.short) : ''}</span></span><span class="row"><button class="icon" data-gsay2="${esc(q.ko)}" aria-label="Escuchar">${ICON.speaker}</button><button class="btn" data-sinext>${c.i + 1 >= N ? 'Ver resultado' : 'Siguiente'} →</button></span></div>` : '';

  };
  c.q = silCase(c, null); draw();
}

/* ---------- Semáforo de cortesía ---------- */

}
const SEM_LV = [['casual', '반말', 'Casual'], ['polite', '해요체', 'Cortés'], ['formal', '합니다체', 'Formal']];

/* ---------- Sombra (shadowing) ---------- */
function startSombra(c) {
  const N = 6, pool = gmSents().filter(s => s.ko.replace(/[^가-힣]/g, '').length <= 14), list = shuffle(pool).slice(0, N);
  c.i = 0; c.pts = 0; c.step = 'ini'; c.show = c.o.ver !== 'no';
  const dur = s => Math.max(1400, s.ko.replace(/[^가-힣]/g, '').length * 300 * (state.slow ? 1.5 : 1));
  const draw = () => {
    const s = list[c.i], words = s.ko.split(' ');
    const text = c.show || c.step === 'rate' ? `<div class="ko" lang="ko" style="font-size:${s.ko.length > 9 ? 30 : 40}px">${words.map((w, k) => `<span class="shw" data-w="${k}">${esc(w)}</span>`).join(' ')}</div><div class="rom rom-static">${esc(s.rom)}</div><div class="es" style="color:var(--muted)">${esc(s.es)}</div>` : '<p class="hint">Escucha con atención y repite lo que oigas.</p>';
    let ctl = '';
    if (c.step === 'ini') ctl = '<button class="btn" data-sl="listen">Escuchar otra vez</button><button class="btn acc" data-sl="go">Repetir a la vez</button>';
    else if (c.step === 'count') ctl = `<div class="shcount">${c.cnt}</div>`;
    else if (c.step === 'play') ctl = '<p class="hint" style="margin:0">Repite en voz alta, siguiendo la barra.</p>';
    else ctl = '<p class="hint" style="margin:0 0 6px;text-align:center">¿Qué tal te sonó tu repetición?</p><div class="row" style="justify-content:center"><button class="btn acc" data-sr="2">Igual de fluido</button><button class="btn" data-sr="1">Casi</button><button class="btn ghost" data-sr="0">Otra vez</button></div>';
    c.el.innerHTML = `<div class="qcard"><span class="tag">Frase ${c.i + 1} de ${N}${s.p ? ' · ' + esc(s.p.ko) : ''}</span>${text}
      <div class="shbar"><i id="shBar"></i></div></div><div class="row" style="justify-content:center;margin-top:12px">${ctl}</div>`;
    c.hud(`${c.i + 1} de ${N}`);
  };
  const listen = () => speak(list[c.i].ko);
  const go = () => {
    const s = list[c.i]; c.step = 'count'; c.cnt = 3; draw();
    const tick = () => {
      if (c.cnt > 1) { c.cnt--; draw(); gmTO(tick, 700); return; }
      c.step = 'play'; draw();
      const d = dur(s), bar = $('#shBar'), ws = $$('.shw', c.el), tot = s.ko.replace(/ /g, '').length;
      if (bar) { bar.style.transition = `width ${d}ms linear`; requestAnimationFrame(() => { bar.style.width = '100%'; }); }
      let acc = 0; ws.forEach((w, k) => { const t0 = acc / tot * d; acc += s.ko.split(' ')[k].length; gmTO(() => { $$('.shw', c.el).forEach(x => x.classList.remove('on')); w.classList.add('on'); }, t0); });
      speak(s.ko);

    };
    gmTO(tick, 700);
  };
  const rate = v => {
    c.pts += v; c.skill(v > 0);
    c.i++; if (c.i >= list.length) return c.finish({ perf: c.pts / (2 * list.length), title: c.pts >= list.length * 1.5 ? '¡Suenas fluido!' : 'Buena práctica', lines: [['Puntos', c.pts + ' / ' + 2 * list.length], ['Frases', list.length]], rec: { key: 'score', val: c.pts }, note: 'Es autoevaluación: la sombra funciona cuanto más en serio la hagas.' });
    c.step = 'ini'; draw(); gmTO(listen, 250);
  };
  c.click = e => {
    const b = e.target.closest('[data-sl]'), r = e.target.closest('[data-sr]');
    if (b) return b.dataset.sl === 'listen' ? listen() : go();
    if (r) rate(+r.dataset.sr);
  };
  draw(); gmTO(listen, 300);

/* ---------- Bingo de escucha ---------- */
function startBingo(c) {
  const useS = c.o.src === 'fra' && gmSents().length >= 9, W = useS ? gmSents().filter(s => s.ko.length <= 12) : gmWords().filter(w => w.ko.length <= 8);
  const size = W.length >= 16 ? 4 : 3, n = size * size;
  const cells = shuffle(useS ? shuffle(W).slice(0, n) : pickWeak(W.map(refIdOf), n).map(id => BYKO.get(id)).filter(Boolean)).slice(0, n);
  c.size = size; c.cells = cells.map(x => ({ ko: x.ko, rom: x.rom, es: x.es, mark: false })); c.mistakes = 0; c.marks = 0; c.lines = 0; c.call = null; c.tries = 0;
  const lineSets = () => { const L = []; for (let i = 0; i < size; i++) { L.push([...Array(size)].map((_, j) => i * size + j)); L.push([...Array(size)].map((_, j) => j * size + i)); } L.push([...Array(size)].map((_, j) => j * size + j)); L.push([...Array(size)].map((_, j) => j * size + size - 1 - j)); return L; };
  const LS = lineSets();
  const countLines = () => LS.filter(l => l.every(i => c.cells[i].mark)).length;
  const callNext = () => { const rest = c.cells.map((x, i) => i).filter(i => !c.cells[i].mark); if (!rest.length) return end(); c.call = gmPick(rest); c.tries = 0; draw(); gmTO(() => speak(c.cells[c.call].ko), 250); };
  const draw = () => {
    c.el.innerHTML = `<div class="qcard" style="min-height:120px"><span class="tag">Escucha y toca la casilla</span><button class="big-play" data-bgsay aria-label="Escuchar de nuevo">${ICON.speaker}</button></div>
      <div class="bingo b${size}">${c.cells.map((x, i) => `<button class="bc${x.mark ? ' mark' : ''}${c.flash === i ? ' bad' : ''}" data-bc="${i}" ${x.mark ? 'disabled' : ''}><span class="ko" lang="ko">${esc(x.ko)}</span>${useS ? '' : `<span class="rom">${esc(x.rom)}</span>`}</button>`).join('')}</div>
      <p class="hint" style="text-align:center">${c.lines ? c.lines + (c.lines === 1 ? ' línea' : ' líneas') + ' · ' : ''}${c.mistakes} de 3 fallos</p>`;
    c.hud(`${c.marks} / ${n} · ${c.mistakes} fallos`);
  };
  const end = () => { const perf = clamp01((c.marks + c.lines * 2 - c.mistakes * 1.5) / (n + 2 * (2 * size + 2))); c.finish({ perf: Math.max(perf, c.marks / n * 0.6 - c.mistakes * 0.1), title: c.marks === n ? '¡Tablero completo!' : 'Fin del bingo', lines: [['Casillas', c.marks + ' / ' + n], ['Líneas', c.lines], ['Fallos', c.mistakes]], rec: { key: 'lines', val: c.lines } }); };
  c.click = e => {
    if (e.target.closest('[data-bgsay]')) return speak(c.cells[c.call].ko);
    const b = e.target.closest('[data-bc]'); if (!b || b.disabled || c.lock) return;
    const i = +b.dataset.bc;
    if (i === c.call) { c.cells[i].mark = true; c.marks++; c.skill(true); c.lines = countLines(); draw(); gmTO(callNext, 350); }
    else { c.mistakes++; c.skill(false); c.flash = i; c.lock = true; draw(); gmTO(() => { c.flash = null; c.lock = false; if (c.mistakes >= 3) return end(); draw(); speak(c.cells[c.call].ko); }, 600); }
  };
  callNext();
}

/* ================= Juegos de teclado y de números: Mecanografía, Lluvia, Wordle y Caja registradora ================= */
const romNorm = s => String(s).split(' / ')[0].toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
const romFlat = s => romNorm(s).replace(/ /g, '');
const hgLetter = j => { const k = HG_JAMO_KEY[j]; return k ? k.code.slice(3).toLowerCase() : ''; };
const NOSYS = 'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';
function shakeEl(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- Mecanografía ---------- */
function startTipeo(c) {
  const han = c.o.ent === 'han', mode = c.o.modo || '60', copy = !han || c.o.ver !== 'no', finite = mode === 'fal' || mode === 'fra';
  const mk = x => { const ko = hgClean(x.ko), r = romNorm(x.rom); return { ko, es: x.es, rom: r, tgt: r.replace(/ /g, ''), keys: hgKeys(ko), id: x.kind ? refIdOf(x) : x.w ? refIdOf(x.w) : null }; };
  const okItem = it => han ? /^[가-힣 ]+$/.test(it.ko) && it.keys.length >= 2 && it.keys.length <= (mode === 'fra' ? 22 : 12) : it.tgt.length >= 2 && it.tgt.length <= (mode === 'fra' ? 34 : 14);
  const dedupe = a => { const s = new Set(); return a.filter(p => !s.has(p.ko) && s.add(p.ko)); };
  const wordsPool = () => dedupe(gmWords().map(mk).filter(it => okItem(it) && !/ /.test(it.ko)));
  let pool = mode === 'fra' ? dedupe(gmSents().map(mk).filter(okItem)) : wordsPool();
  if (pool.length < 3) pool = dedupe(gmWords().map(mk).filter(okItem));
  if (pool.length < 2) { c.el.innerHTML = '<div class="box"><p class="lede">Aún no hay suficientes palabras para este modo.</p><button class="btn" data-gm="hub">Volver</button></div>'; return; }
  const byId = new Map(pool.filter(p => p.id).map(p => [p.id, p]));
  c.words = 0; c.good = 0; c.run = 0; c.strokes = 0; c.errs = 0; c.bad = {}; c.n = 0; c.total = mode === 'fra' ? Math.min(5, pool.length) : mode === 'fal' ? Math.min(10, pool.length) : 0;
  c.cur = null; c.keys = []; c.typed = ''; c.wErr = 0; c.started = false; c.t0 = 0; c.left = 60000; c.lock = false; c.last = [];
  let bag = [];
  const nextItem = () => {
    if (!bag.length) {
      if (mode === 'fal') {
        const g = gmData();
        bag = Object.keys(g.miss).sort((a, b) => g.miss[b] - g.miss[a]).map(id => byId.get(id)).filter(Boolean).slice(0, c.total);
        if (bag.length < c.total) { const have = new Set(bag.map(x => x.id)), ids = pickWeak(pool.filter(p => p.id && !have.has(p.id)).map(p => p.id), c.total - bag.length); bag = bag.concat(ids.map(id => byId.get(id))); }
        bag = shuffle(bag.filter(Boolean));

  };
  const hasSpace = () => c.cur.keys.includes(' ');
  const hiKey = () => (copy || c.wErr >= 2) && c.keys.length < c.cur.keys.length ? c.cur.keys[c.keys.length] : '';
  const hud = () => c.hud(mode === '60' ? `${gmSec(c.left)} s · ${c.words} palabras` : mode === 'sin' ? `Racha ${c.run}` : `${c.n} de ${c.total}`);
  const upd = () => {
    const w = c.cur;
    if (han) {
      const t = $('#tTyped'); if (t) t.innerHTML = `${esc(hgAssemble(c.keys))}<i class="caret"></i>`;
      const kb = $('#tKbd'); if (kb) kb.innerHTML = kbdHTML({ lay: 'ko', shift: c.shift, hi: hiKey(), space: hasSpace() });
    } else {
      const l = $('#tLine'); if (!l) return; let k = 0, h = '';
      for (const ch of w.rom) { if (ch === ' ') { h += ' '; continue; } h += `<span class="${k < c.typed.length ? 'ok' : k === c.typed.length ? 'cur' : ''}">${esc(ch)}</span>`; k++; }
      l.innerHTML = h;
    }
    hud();
  };
  const drawCard = () => {
    const w = c.cur, reveal = copy || c.wErr >= 2, nm = { 60: 'Contrarreloj', sin: 'Sin errores', fal: 'Mis falladas', fra: 'Frases' }[mode];
    const ko = !han || reveal ? `<div class="ko tp-ko" lang="ko">${esc(w.ko)}</div>` : `<div class="ko tp-ko hid" aria-label="Palabra oculta">${'＿'.repeat(w.ko.replace(/ /g, '').length)}</div>`;
    $('#tCard').innerHTML = `<div class="qcard gmtype"><span class="tag">${nm}${finite ? ` · ${c.n + 1} de ${c.total}` : ''}</span>${ko}<div class="es" style="color:var(--muted)">${esc(w.es)}</div>${han ? `<div class="rom rom-static">${esc(w.rom)}</div><div class="ttyped" id="tTyped" lang="ko"></div>` : '<div class="tline" id="tLine"></div>'}</div>`;
    upd();
  };
  const end = () => {
    if (c.done) return;
    const mins = mode === '60' ? 1 : Math.max(0.05, (Date.now() - (c.t0 || Date.now())) / 60000);
    const speed = c.words ? Math.round(han ? c.good / mins : c.good / 5 / mins) : 0, prec = c.strokes ? Math.round((c.strokes - c.errs) / c.strokes * 100) : 100;
    const perf = mode === 'sin' ? c.run / 20 : clamp01(speed / (han ? 180 : 30)) * Math.pow(prec / 100, 2);
    const top = Object.keys(c.bad).sort((a, b) => c.bad[b] - c.bad[a]).slice(0, 3);
    const lines = mode === 'sin' ? [['Palabras seguidas', c.run], ['Pulsaciones', c.strokes]] : [[han ? 'Pulsaciones/min' : 'Palabras/min', speed], ['Precisión', prec + '%'], ['Palabras', c.words], ['Errores', c.errs]];
    const rec = mode === 'sin' ? { key: han ? 'runh' : 'run', val: c.run } : c.words >= 3 && prec >= 80 ? { key: han ? 'taj' : 'wpm', val: speed } : null;
    c.finish({ perf, title: mode === 'sin' ? (c.run >= 10 ? '¡Sin una sola falla!' : 'Se acabó la racha') : c.words === 0 ? 'Sin palabras' : prec >= 96 ? '¡Manos limpias!' : 'Buen ritmo', lines, rec,
      extra: han && top.length ? `<p class="hint">Teclas para practicar: ${top.map(j => `<b lang="ko">${esc(j)}</b> (tecla ${hgLetter(j).toUpperCase()})`).join(' · ')}</p>` : '',
      after: () => { if (han) { const g = gmData(); g.kbd = (g.kbd || 0) + c.words; } } });
  };
  const start = () => { if (c.started) return; c.started = true; c.t0 = Date.now(); if (mode === '60') gmClock(c, 60000, hud, end); };
  const wordDone = () => {
    const w = c.cur; c.words++; c.run++; c.good += han ? w.keys.length : w.tgt.length; c.skill(c.wErr === 0);
    if (w.id) c.wErr ? gmMissAdd(w.id) : gmMissDone(w.id);
    c.n++; if (finite && c.n >= c.total) return end();
    c.cur = nextItem(); c.keys = []; c.typed = ''; c.wErr = 0; c.shift = false;
    const sy = $('#tSys'); if (sy) sy.value = '';
    drawCard();
  };
  const err = exp => {
    c.errs++; c.wErr++; if (han && exp != null && exp !== ' ') c.bad[exp] = (c.bad[exp] || 0) + 1;
    shakeEl($('#tCard .qcard'));
    if (mode === 'sin') { c.lock = true; c.run = Math.max(0, c.run); const h = $('#tHint'); if (h) h.textContent = 'Fallaste: se acaba la racha.'; gmTO(end, 700); }
    else if (han && !copy && c.wErr === 2) drawCard();

  c.kact = a => {
    if (c.lock || c.done) return;

  };

    : `<div class="tinwrap"><input id="tIn" class="tinput" ${NOSYS} placeholder="escribe aquí" aria-label="Escribe la romanización"></div>`}
    <p class="hint" id="tHint" style="text-align:center">${mode === '60' ? 'El reloj empieza con tu primera tecla. ' : ''}${han ? 'Las teclas equivocadas no cuentan como escritas.' : 'Los espacios no hacen falta.'}</p>`;
  c.cur = nextItem(); drawCard();

}

/* ---------- Lluvia de palabras ---------- */
function startLluvia(c) {

  const mkW = w => ({ w, ko: w.ko, es: w.es, rom: romFlat(w.rom), tgt: romFlat(w.rom), keys: hgKeys(w.ko), y: -46, x: 0, k: 0 });

  const spawn = () => {
    const f = F(); if (!f) return;
    let pl = all.filter(okW); if (pl.length < 4) pl = all;
    const act = c.ws.map(o => o.ko), ids = pl.filter(w => !act.includes(w.ko) && !c.recent.includes(w.ko)).map(refIdOf);
    if (!ids.length) return;
    const w = BYKO.get(gmPick(pickWeak(ids, Math.min(ids.length, 8)))), o = mkW(w);
    const clash = c.ws.some(x => han ? hgIsPrefix(x.keys, o.keys) || hgIsPrefix(o.keys, x.keys) : x.tgt.startsWith(o.tgt) || o.tgt.startsWith(x.tgt));
    if (clash) { c.spawnT = 150; return; }
    const fw = f.clientWidth, ww = o.ko.length * 30 + 48;
    let x = 6, tries = 0;
    do { x = 6 + Math.random() * Math.max(1, fw - ww - 12); tries++; } while (tries < 6 && c.ws.some(z => z.y < 60 && Math.abs(z.x - x) < ww));
    o.x = x; o.el = document.createElement('div'); o.el.className = 'rw'; o.el.innerHTML = wordHTML(o); o.el.style.transform = `translate(${x}px,${o.y}px)`;
    f.appendChild(o.el); c.ws.push(o); c.recent.push(o.ko); if (c.recent.length > 6) c.recent.shift();
    refresh();
  };
  const drop = o => { c.ws = c.ws.filter(x => x !== o); };
  const buf = () => (han ? c.keys : [...c.typed]);
  const nextHi = () => {
    if (!han || c.lv > 2) return '';
    const nb = c.keys, cs = c.ws.filter(o => hgIsPrefix(nb, o.keys) && o.keys.length > nb.length).sort((a, b) => b.y - a.y);
    return cs.length ? cs[0].keys[nb.length] : '';
  };
  const refresh = () => {
    const nb = buf();
    c.ws.forEach(o => {
      const on = nb.length && (han ? hgIsPrefix(nb, o.keys) : o.tgt.startsWith(c.typed));
      let k = 0;
      if (on) { if (han) { const comp = hgAssemble(nb); k = comp.length; if (comp[k - 1] !== o.ko[k - 1]) k--; } else k = c.typed.length; }

function plantOf(id, now) {                                      // { st: 0-4, thirsty, lapse } o null si aún no hay tarjetas

  const st = Math.min(...cs.map(rank));

}

const stagePassed = k => !!(home.bosses[k] && home.bosses[k].pass);
const curStage = () => { const k = STAGES.findIndex((s, i) => !stageDone(i)); return k < 0 ? STAGES.length - 1 : k; };
function journeyCheck() {                                        // avisa al llegar a una etapa nueva (+20 monedas)
  STAGES.forEach((s, k) => {
    if (!stageReached(k) || home.seenStage[k]) return;
    home.seenStage[k] = 1;
    if (k > 0) { addCoins(20); toast('Llegaste a ' + s.es + ' ' + s.ko + ' · +20 monedas'); }
    saveHome();
  });
}
const stampHTML = (k, on) => `<div class="stamp${on ? ' on' : ''}" title="${on ? 'Sello de ' + STAGES[k].es : 'Sin sellar'}"><span lang="ko">${on ? STAGES[k].ko : '?'}</span><small>${on ? STAGES[k].rom : STAGES[k].es}</small></div>`;

function stageCardHTML(k) {
  const s = STAGES[k], reach = stageReached(k), done = stageDone(k), pass = stagePassed(k), cur = curStage() === k;
  if (!reach) return `<div class="box scard lock"><div class="st-h"><span class="st-n">${k + 1}</span><div><b lang="ko">${s.ko}</b> <span class="rom always">${s.rom}</span><div class="es">${esc(s.es)} · se abre al terminar la lección ${s.from}</div></div><span class="st-i">${ICON.lock}</span></div></div>`;
  const ls = blockLessons(k), total = ls.reduce((a, l) => a + l.items.length, 0), got = ls.reduce((a, l) => a + (l.n <= home.lessons ? l.items.length : 0), 0);
  const b = home.bosses[k];
  const boss = !done ? `<p class="hint" style="margin:8px 0 0">El jefe <b>${esc(s.boss)}</b> aparece al terminar la lección ${s.to}.</p>`
    : `<div class="boss-row"><div><b>Jefe: ${esc(s.boss)}</b><div class="es">${b ? `Mejor resultado ${b.best} de 10 · ${b.n} intento${b.n === 1 ? '' : 's'}` : '10 preguntas de este bloque. Se aprueba con 8. Sin límite de intentos.'}</div></div>
      <button class="btn${pass ? '' : ' acc'}" data-sp="boss:${k}">${pass ? 'Jugar otra vez' : b ? 'Reintentar' : 'Enfrentar'}</button></div>`;
  const words = got ? `<div class="chipline">${ls.filter(l => l.n <= home.lessons).flatMap(l => lessonWords(l)).slice(0, 40).map(w => `<button class="wchip" data-say="${esc(w.ko)}" title="${esc(w.es)}"><span lang="ko">${esc(w.ko.length > 9 ? w.ko.slice(0, 8) + '…' : w.ko)}</span></button>`).join('')}</div>` : '';

}

  if (hv.read && typeof readerHTML === 'function') return readerHTML();

const readNeed = r => { const u = unlockedRefs(home.lessons); return r.need.map(k => ({ k, ok: u.has('v:' + k) || u.has('p:' + k) })); };

function readAnswer(qi, k) {
  const r = READS.find(x => x.id === hv.read); if (!r || rd.a[qi] != null) return;
  rd.a[qi] = k; skill('lec', k === r.q[qi].a);
  if (rd.a.length === r.q.length && rd.a.every(x => x != null)) {
    const okN = rd.a.filter((x, i) => x === r.q[i].a).length, first = !home.reads[r.id];
    home.reads[r.id] = { ok: Math.max(okN, (home.reads[r.id] || {}).ok || 0), n: r.q.length, d: todayKey() };
    if (first) { home.stats.reads++; addXP(20); addCoins(8); toast('Texto leído · +20 XP · +8 monedas'); } else saveHome();
    checkAch();
  }
  renderHome();
}

  if (t.closest('#rdBack')) { hv.read = null; renderHome(); return; }
  const tk = t.closest('[data-tk]'); if (tk && hv.read) { const [i, j] = tk.dataset.tk.split(':').map(Number); rd.sel = [i, j]; const ko = tkCore(READS.find(x => x.id === hv.read).lines[i][j][0]); renderHome(); if (/[가-힣]/.test(ko)) speak(ko); return; }
  const ra = t.closest('[data-ra]'); if (ra && hv.read) { const [q, k] = ra.dataset.ra.split(':').map(Number); readAnswer(q, k); }

    { t: 'Palabra en coreano', size: 34, color: '--muted', gap: 40 },
    { t: it.ko, size: it.ko.length > 8 ? 96 : 190, weight: 500, gap: 24, lines: 3, max: 860 },
    { t: it.rom, size: 54, color: '--rom', gap: 24 },
    { t: it.es, size: 62, weight: 500, gap: 46, lines: 3 }
  ];
  if (m) { blocks.push({ t: 'Suena como: ' + m.sound, size: 38, color: '--accent', gap: 16, lines: 2 }); blocks.push({ t: m.story, size: 32, color: '--muted', gap: 10, lines: 5 }); }
  const blob = await cardPNG(blocks, 'Aprendiendo coreano · ' + new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long' }));
  if (blob) shareBlob(blob, 'coreano-' + it.rom.replace(/\W+/g, '-') + '.png', teachTexts(tc.id).chal);
}
function teachDone() {
  const k = todayKey() + ':' + tc.id; if (home.teach[k]) return;
  home.teach[k] = 1; home.stats.teach++;
  Object.keys(home.teach).sort().slice(0, -60).forEach(x => delete home.teach[x]);
  const xp = bonusOnce('teach', 15), c = home.bonus[todayKey() + ':teachc'] ? 0 : (home.bonus[todayKey() + ':teachc'] = 1, addCoins(5));
  saveHome(); checkAch(); toast('¡Bien enseñado!' + (xp ? ' +' + xp + ' XP' : '') + (c ? ' · +' + c + ' monedas' : ''));
  renderHome();
}
hEl.addEventListener('click', e => {
  if (hv.view !== 'dash' || hv.sub !== 'retos') return;
  const t = e.target, st = t.closest('[data-tcs]');
  if (st) { const i = +st.dataset.tcs; tc.s[i] = !tc.s[i]; const y = window.scrollY; renderHome(); window.scrollTo(0, y); return; }
  if (t.closest('[data-tcdo]')) return teachDone();
  if (t.closest('[data-tccard]')) return teachCard();
  if (t.closest('[data-tccopy]')) return copyText(teachTexts(tc.id).chal);
});
hEl.addEventListener('change', e => {
  if (e.target.id !== 'tcSel' || hv.sub !== 'retos') return;
  tc.id = e.target.value; tc.s = [false, false, false]; const y = window.scrollY; renderHome(); window.scrollTo(0, y);
});

/* ================= Tienda: monedas y personalización =================
   Las monedas solo compran cosas de adorno (colores, sello personal) y un escudo de racha. Nada de lo que aprendes se compra ni se bloquea. */
const SKINS = [
  { id: 'base', name: 'Tinta y arcilla', price: 0, sw: ['#A8452F', '#F1E0D8'] },
  { id: 'cerezo', name: 'Cerezo', price: 80, sw: ['#B84A6E', '#F5DFE7'] },
  { id: 'bosque', name: 'Bosque', price: 80, sw: ['#3F7A4F', '#DDEBDF'] },
  { id: 'oceano', name: 'Océano', price: 80, sw: ['#2D6AA3', '#DCE7F3'] },
  { id: 'ciruela', name: 'Ciruela', price: 100, sw: ['#6B4E9B', '#E6DFF1'] },
  { id: 'tinta', name: 'Tinta sola', price: 120, sw: ['#211F1C', '#E4E0D6'] }
];
const AVATARS = [['별', 'byeol', 'Estrella'], ['달', 'dal', 'Luna'], ['꽃', 'kkot', 'Flor'], ['산', 'san', 'Montaña'], ['강', 'gang', 'Río'], ['봄', 'bom', 'Primavera']];
const AV_PRICE = 30, SHIELD_PRICE = 100;
function buy(kind, id) {
  const price = kind === 'skin' ? SKINS.find(s => s.id === id).price : kind === 'av' ? AV_PRICE : SHIELD_PRICE;
  if (kind === 'shield') { if (home.streak.shields >= 2) return toast('Ya tienes el máximo de 2 escudos.'); }
  else if (home.inv[kind][id]) return;
  if (home.coins < price) return toast('Te faltan ' + (price - home.coins) + ' monedas.');
  home.coins -= price; home.stats.spent += price;
  if (kind === 'shield') { home.streak.shields++; toast('Escudo añadido: perdona un día de estudio perdido.'); }
  else { home.inv[kind][id] = 1; if (kind === 'skin') { home.skin = id; applySkin(); } else home.av = id; toast('Listo: ya es tuyo.'); }
  saveHome(); checkAch(); renderHome();
}
function useItem(kind, id) {
  if (kind === 'skin' && home.inv.skin[id]) { home.skin = id; applySkin(); }
  else if (kind === 'av') home.av = id === home.av ? '' : id;
  saveHome(); renderHome();
}
function shopHTML() {
  const bal = `<div class="coinbar"><span class="fl">${ICON.coin}</span><b>${home.coins}</b><small>monedas</small></div>`;
  const skin = s => {
    const own = !!home.inv.skin[s.id], on = home.skin === s.id;
    return `<div class="sitem${on ? ' on' : ''}"><span class="sw"><i style="background:${s.sw[0]}"></i><i style="background:${s.sw[1]}"></i></span><b>${esc(s.name)}</b>
      ${own ? `<button class="btn sm${on ? '' : ' acc'}" data-use="skin:${s.id}" ${on ? 'disabled' : ''}>${on ? 'En uso' : 'Usar'}</button>` : `<button class="btn sm" data-buy="skin:${s.id}" ${home.coins < s.price ? 'aria-disabled="true"' : ''}>${ICON.coin.replace('<svg', '<svg style="width:15px;height:15px"')} ${s.price}</button>`}</div>`;
  };
  const av = ([k, r, e]) => {
    const own = !!home.inv.av[k], on = home.av === k;
    return `<div class="sitem${on ? ' on' : ''}"><span class="avatar big" lang="ko">${k}</span><b>${esc(e)} <small class="rom always">${r}</small></b>
      ${own ? `<button class="btn sm${on ? '' : ' acc'}" data-use="av:${k}">${on ? 'Quitar' : 'Usar'}</button>` : `<button class="btn sm" data-buy="av:${k}">${ICON.coin.replace('<svg', '<svg style="width:15px;height:15px"')} ${AV_PRICE}</button>`}</div>`;
  };
  const gain = [['Lección diaria', '10 (+5 sin errores)'], ['Cofre semanal', '30'], ['Jefe de bloque (primera vez)', '40'], ['Llegar a una etapa nueva', '20'], ['Misión de la semana', '25'], ['Texto leído (primera vez)', '8'], ['Diagnóstico, extra, laboratorio y enseñar', '3 a 10 al día']];
  return `<div class="box"><h3>Tienda <span class="ko-s">상점</span></h3>${bal}
    <p class="lede">Gana monedas con lo que ya haces y gástalas en adornos. Nada de lo que aprendes se compra, y no las necesitas para avanzar.</p></div>
    <div class="box"><h3>Colores de la aplicación</h3><div class="shopgrid">${SKINS.map(skin).join('')}</div></div>
    <div class="box"><h3>Sello personal</h3><p class="lede">Un carácter que te acompaña junto a tu título.</p><div class="shopgrid">${AVATARS.map(av).join('')}</div></div>
    <div class="box"><h3>Escudo de racha</h3><div class="sitem row1"><span class="fl" style="width:26px;height:26px">${ICON.shield}</span><div style="flex:1"><b>Escudo</b><div class="es">Perdona un día de estudio perdido. Tienes ${home.streak.shields} de 2.</div></div>
      <button class="btn sm" data-buy="shield:x" ${home.coins < SHIELD_PRICE || home.streak.shields >= 2 ? 'aria-disabled="true"' : ''}>${ICON.coin.replace('<svg', '<svg style="width:15px;height:15px"')} ${SHIELD_PRICE}</button></div></div>
    <div class="box"><h3>Cómo ganar monedas</h3><div class="gain">${gain.map(g => `<div><span>${g[0]}</span><b>${g[1]}</b></div>`).join('')}</div>
      <p class="hint" style="margin-top:8px">Has ganado ${home.stats.earned} y gastado ${home.stats.spent}. Las recompensas materiales pueden restarle interés a lo que ya te gusta hacer; por eso aquí son solo de adorno y opcionales.</p></div>${sealsHTML()}`;
}
hEl.addEventListener('click', e => {
  if (hv.view !== 'dash' || hv.sub !== 'tienda') return;
  const b = e.target.closest('[data-buy]'), u = e.target.closest('[data-use]');
  if (b) { const [k, id] = b.dataset.buy.split(':'); buy(k, id); }
  else if (u) { const [k, id] = u.dataset.use.split(':'); useItem(k, id); }
});

  { id: 'siblings', t: 'Hermanos mayores… y amigos cercanos', ko: '형 · 누나 · 오빠 · 언니', rom: 'hyeong · nuna · oppa · eonni', es: 'hermano/a mayor', txt: 'Hay una palabra distinta según quién habla: un hombre dice 형 (hermano mayor) y 누나 (hermana mayor); una mujer dice 오빠 (hermano mayor) y 언니 (hermana mayor). Se usan también con amigos cercanos algo mayores.', tip: 'Si te lo piden, puedes usarlas con gente de confianza.' },
  { id: 'utensils', t: 'Cuchara y palillos de metal', ko: '숟가락 · 젓가락', rom: 'sutgarak · jeotgarak', es: 'cuchara · palillos', txt: 'Los palillos coreanos suelen ser planos y de metal, y la cuchara se usa para el arroz y las sopas. Se considera de mala educación clavar los palillos o la cuchara de pie en el arroz, porque recuerda a las ofrendas rituales.', tip: 'Déjalos apoyados sobre la mesa o el tazón.' },

  { id: 'hangeulday', t: 'El día del hangul', ko: '한글날', rom: 'hangeullal', es: 'día del hangul', txt: 'En Corea del Sur se celebra el 9 de octubre. Recuerda la promulgación del alfabeto y es un día de descanso oficial.', tip: 'Buena fecha para repasar todo lo que sabes.' },
